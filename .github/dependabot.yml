version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /packaging/synology/ui-src
    schedule:
      interval: monthly
    ignore:
      # DSM supplies Vue 2 at runtime; these majors require a Vue 3 host ABI.
      - dependency-name: vue
        update-types:
          - version-update:semver-major
      - dependency-name: vue-loader
        update-types:
          - version-update:semver-major
