name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    name: RustSec and license notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Audit locked dependencies against fresh RustSec data
        run: bash .github/scripts/run-cargo-audit.sh
      - name: Reproduce third-party notices from Cargo.lock
        run: bash .github/scripts/generate-third-party-notices.sh "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
      - name: Refuse stale third-party notices
        run: cmp --silent THIRD_PARTY_LICENSES.html "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"

  test:
    name: Test ${{ matrix.platform }} ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            architecture: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            architecture: aarch64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            architecture: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test-${{ matrix.target }}
      - name: Formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features --target "${{ matrix.target }}" -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --target "${{ matrix.target }}"
      - name: Release build
        run: cargo build --release --locked --target "${{ matrix.target }}"

  coverage:
    name: Coverage (90% line gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install pinned cargo-llvm-cov
        shell: bash
        run: |
          set -euo pipefail
          source .config/coverage.env
          cargo "+$RUST_TOOLCHAIN" install cargo-llvm-cov \
            --version "$CARGO_LLVM_COV_VERSION" \
            --locked
      - name: Enforce repository line coverage
        run: bash scripts/coverage.sh check
      - name: Preserve coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: target/llvm-cov/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Rust 1.88 compatibility
        run: cargo test --locked --all-targets

  synology-package:
    name: Synology package ${{ matrix.synology_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            synology_arch: x86_64
            elf_machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            synology_arch: armv8
            elf_machine: AArch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: synology-${{ matrix.synology_arch }}
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools
      - name: Build DSM-portable static binary
        env:
          SDSYNC_BUILD_VERSION: 0.0.0
          RUST_TARGET: ${{ matrix.rust_target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target "$RUST_TARGET"
      - name: Verify DSM binary architecture and static linkage
        shell: bash
        env:
          ELF_MACHINE: ${{ matrix.elf_machine }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/synology-drive-sync"
          machine=$(readelf --file-header --wide "$binary" | awk -F: '/Machine:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
          [[ "$machine" == "$ELF_MACHINE" ]] || {
            echo "unexpected ELF machine: $machine (expected $ELF_MACHINE)" >&2
            exit 1
          }
          if readelf --program-headers --wide "$binary" | grep -q 'INTERP'; then
            echo 'DSM binary must not require a host ELF interpreter' >&2
            exit 1
          fi
          if readelf --dynamic --wide "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo 'DSM binary must not require host dynamic libraries' >&2
            exit 1
          fi
          reported=$("$binary" --version)
          [[ "$reported" == 'synology-drive-sync 0.0.0' ]]
      - name: Assemble and validate installable SPK
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          SYNOLOGY_ARCH: ${{ matrix.synology_arch }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/synology-drive-sync"
          bash packaging/synology/build-spk.sh \
            --binary "$binary" \
            --arch "$SYNOLOGY_ARCH" \
            --version 0.0.0 \
            --output dist
          spk="dist/synology-drive-sync-0.0.0-$SYNOLOGY_ARCH.spk"
          python3 packaging/synology/validate_spk.py \
            --binary "$binary" \
            --arch "$SYNOLOGY_ARCH" \
            "$spk"

  packaging:
    name: Packaging and container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: packaging
      - name: Build the binary the packaging validators execute
        run: cargo build --locked
      - name: Validate shell and Docker input line endings
        run: bash .github/scripts/validate-packaging.sh
      - name: Validate Synology package templates
        run: python3 packaging/synology/validate_spk.py
      - name: Test Synology package builder and DSM lifecycle
        run: python3 packaging/synology/test_synology_package.py
      - name: Parse PowerShell packaging scripts
        shell: pwsh
        run: ./.github/scripts/validate-powershell.ps1
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
      - name: Validate Compose configurations
        env:
          SDSYNC_URL: https://files.example.invalid
          SDSYNC_USERNAME: ci-audit
          SDSYNC_SOURCE: ${{ github.workspace }}
          SDSYNC_REMOTE: /ci-audit
          SDSYNC_PASSWORD_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_TOTP_SECRET_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_JOBS: "2"
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.totp.yaml config --quiet
      - name: Build documented Compose image
        env:
          SDSYNC_URL: https://files.example.invalid
          SDSYNC_USERNAME: ci-audit
          SDSYNC_SOURCE: ${{ github.workspace }}
          SDSYNC_REMOTE: /ci-audit
          SDSYNC_PASSWORD_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_JOBS: "2"
          DOCKER_BUILDKIT: "1"
        run: docker compose -f compose.yaml build sync
      - name: Smoke-test hardened container entrypoint
        env:
          SDSYNC_URL: https://files.example.invalid
          SDSYNC_USERNAME: ci-audit
          SDSYNC_SOURCE: ${{ github.workspace }}
          SDSYNC_REMOTE: /ci-audit
          SDSYNC_PASSWORD_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_TOTP_SECRET_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_JOBS: "2"
        run: |
          set -euo pipefail
          reported=$(docker compose -f compose.yaml run --rm --no-deps -T sync --version)
          expected='synology-drive-sync local'
          if [[ "$reported" != "$expected" ]]; then
            echo "Compose entrypoint version did not exactly match $expected: $reported" >&2
            exit 1
          fi

          docker compose -f compose.yaml run --rm --no-deps -T \
            --entrypoint /bin/sh sync -eu -c '
              [ "$(id -u):$(id -g)" = "10001:10001" ]
              [ -r /source/LICENSE ]
              [ -s /run/secrets/sdsync_password ]
              [ -r /run/secrets/sdsync_password ]
            '

          docker compose -f compose.yaml -f compose.totp.yaml run \
            --rm --no-deps -T --entrypoint /bin/sh sync -eu -c '
              [ "$(id -u):$(id -g)" = "10001:10001" ]
              [ -r /source/LICENSE ]
              [ -s /run/secrets/sdsync_password ]
              [ -r /run/secrets/sdsync_password ]
              [ -s /run/secrets/sdsync_totp ]
              [ -r /run/secrets/sdsync_totp ]
            '

          user=$(docker image inspect synology-drive-sync:local --format '{{.Config.User}}')
          [[ "$user" == '10001:10001' ]]
