name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    name: RustSec and license notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Audit locked dependencies against fresh RustSec data
        run: bash .github/scripts/run-cargo-audit.sh
      - name: Reproduce third-party notices from Cargo.lock
        run: bash .github/scripts/generate-third-party-notices.sh "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"
      - name: Refuse stale third-party notices
        run: cmp --silent THIRD_PARTY_LICENSES.html "$RUNNER_TEMP/THIRD_PARTY_LICENSES.html"

  test:
    name: Test ${{ matrix.platform }} ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            architecture: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            architecture: aarch64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            architecture: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test-${{ matrix.target }}
      - name: Formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --target "${{ matrix.target }}" -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets --target "${{ matrix.target }}"
      - name: Release CLI build
        run: cargo build --release --locked -p synology-drive-sync --target "${{ matrix.target }}"
      - name: Unwind-safe C SDK build
        run: >-
          cargo build --profile ffi-release --locked
          -p synology-drive-sync-ffi --target "${{ matrix.target }}"
      - name: Exercise non-mutating Windows release installer
        if: >-
          matrix.target == 'x86_64-pc-windows-msvc' &&
          (github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $sandbox = Join-Path $runnerTemp (
            'sdsync-installer-whatif-' + [Guid]::NewGuid().ToString('N')
          )
          [void] [IO.Directory]::CreateDirectory($sandbox)
          $previousTemp = $env:TEMP
          $previousTmp = $env:TMP
          try {
            $env:TEMP = $sandbox
            $env:TMP = $sandbox
            $installDir = Join-Path $sandbox 'persistent-install'
            & ./packaging/install.ps1 -InstallDir $installDir -WhatIf
            if (Test-Path -LiteralPath $installDir) {
              throw "-WhatIf created the persistent install path: $installDir"
            }
            $leftovers = @(Get-ChildItem -LiteralPath $sandbox -Force)
            if ($leftovers.Count -ne 0) {
              throw "-WhatIf leaked scratch paths: $($leftovers.FullName -join ', ')"
            }
          }
          finally {
            $env:TEMP = $previousTemp
            $env:TMP = $previousTmp
            if ([IO.Directory]::Exists($sandbox)) {
              $resolvedSandbox = [IO.Path]::GetFullPath($sandbox)
              $relative = [IO.Path]::GetRelativePath($runnerTemp, $resolvedSandbox)
              if ([IO.Path]::IsPathRooted($relative) -or
                  $relative.StartsWith('..', [StringComparison]::Ordinal) -or
                  -not ([IO.Path]::GetFileName($resolvedSandbox)).StartsWith(
                    'sdsync-installer-whatif-',
                    [StringComparison]::Ordinal
                  )) {
                throw "Refusing to clean unexpected installer sandbox: $resolvedSandbox"
              }
              [IO.Directory]::Delete($resolvedSandbox, $true)
            }
          }

  coverage:
    name: Coverage (90% non-DSM / 74% DSM line gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install pinned cargo-llvm-cov
        shell: bash
        run: |
          set -euo pipefail
          source .config/coverage.env
          cargo "+$RUST_TOOLCHAIN" install cargo-llvm-cov \
            --version "$CARGO_LLVM_COV_VERSION" \
            --locked
      - name: Enforce split repository line coverage
        run: bash scripts/coverage.sh check
      - name: Preserve coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary
          path: target/llvm-cov/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Rust 1.88 compatibility
        run: cargo test --locked --workspace --all-targets

  synology-package:
    name: Synology package ${{ matrix.synology_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            synology_arch: x86_64
            elf_class: ELF64
            elf_machine: Advanced Micro Devices X86-64
            cross_compile: false
            qemu_binary: ""
            qemu_cpu: ""
            arm_hard_float: false
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            synology_arch: armv8
            elf_class: ELF64
            elf_machine: AArch64
            cross_compile: false
            qemu_binary: ""
            qemu_cpu: ""
            arm_hard_float: false
          - runner: ubuntu-24.04
            rust_target: i686-unknown-linux-musl
            synology_arch: i686
            elf_class: ELF32
            elf_machine: Intel 80386
            cross_compile: true
            qemu_binary: qemu-i386
            qemu_cpu: qemu32
            arm_hard_float: false
          - runner: ubuntu-24.04
            rust_target: armv7-unknown-linux-musleabihf
            synology_arch: armv7
            elf_class: ELF32
            elf_machine: ARM
            cross_compile: true
            qemu_binary: qemu-arm
            qemu_cpu: cortex-a9,neon=off,vfp-d32=off
            arm_hard_float: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: packaging/synology/ui-src/package.json
      - name: Build native DSM AppWindow assets
        working-directory: packaging/synology/ui-src
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run build
          git diff --exit-code -- dist
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: synology-${{ matrix.synology_arch }}
      - name: Install pinned Zig cross-linker
        if: matrix.cross_compile == true
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install pinned cargo-zigbuild
        if: matrix.cross_compile == true
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-zigbuild@0.23.2
      - name: Extract pinned QEMU user emulator
        if: matrix.cross_compile == true
        env:
          QEMU_BINARY: ${{ matrix.qemu_binary }}
          QEMU_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        run: |
          set -euo pipefail
          container=$(docker create "$QEMU_IMAGE")
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$container:/usr/bin/$QEMU_BINARY" "$RUNNER_TEMP/$QEMU_BINARY"
          chmod 0755 "$RUNNER_TEMP/$QEMU_BINARY"
          "$RUNNER_TEMP/$QEMU_BINARY" --version
      - name: Install native musl toolchain
        if: matrix.cross_compile != true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools
      - name: Build native DSM-portable static binary
        if: matrix.cross_compile != true
        env:
          SDSYNC_BUILD_VERSION: 0.0.0
          RUST_TARGET: ${{ matrix.rust_target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: >-
          cargo build --release --locked
          --package synology-drive-sync
          --bin synology-drive-sync --bin sdsync-dsm-api
          --target "$RUST_TARGET"
      - name: Cross-build DSM-portable static binary
        if: matrix.cross_compile == true
        env:
          SDSYNC_BUILD_VERSION: 0.0.0
          RUST_TARGET: ${{ matrix.rust_target }}
        run: >-
          cargo zigbuild --release --locked
          --package synology-drive-sync
          --bin synology-drive-sync --bin sdsync-dsm-api
          --target "$RUST_TARGET"
      - name: Verify DSM binaries, architecture and static linkage
        shell: bash
        env:
          ARM_HARD_FLOAT: ${{ matrix.arm_hard_float }}
          ELF_CLASS: ${{ matrix.elf_class }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
          QEMU_BINARY: ${{ matrix.qemu_binary }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/synology-drive-sync"
          api_binary="target/$RUST_TARGET/release/sdsync-dsm-api"
          for checked_binary in "$binary" "$api_binary"; do
            label=$(basename "$checked_binary")
            class=$(readelf --file-header --wide "$checked_binary" | awk -F: '/Class:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
            [[ "$class" == "$ELF_CLASS" ]] || {
              echo "$label has unexpected ELF class: $class (expected $ELF_CLASS)" >&2
              exit 1
            }
            machine=$(readelf --file-header --wide "$checked_binary" | awk -F: '/Machine:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
            [[ "$machine" == "$ELF_MACHINE" ]] || {
              echo "$label has unexpected ELF machine: $machine (expected $ELF_MACHINE)" >&2
              exit 1
            }
            if readelf --program-headers --wide "$checked_binary" | grep -q 'INTERP'; then
              echo "$label must not require a host ELF interpreter" >&2
              exit 1
            fi
            if readelf --dynamic --wide "$checked_binary" 2>/dev/null | grep -q 'NEEDED'; then
              echo "$label must not require host dynamic libraries" >&2
              exit 1
            fi
            if [[ "$ARM_HARD_FLOAT" == true ]]; then
              flags=$(readelf --file-header --wide "$checked_binary" | awk -F: '/Flags:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
              [[ "$flags" == *'Version5 EABI'* && "$flags" == *'hard-float ABI'* ]] || {
                echo "$label does not declare EABI5 hard-float: $flags" >&2
                exit 1
              }
            fi
          done
          if [[ -n "$QEMU_BINARY" ]]; then
            emulator="$RUNNER_TEMP/$QEMU_BINARY"
            [[ -x "$emulator" ]] || {
              echo "pinned QEMU emulator is missing: $emulator" >&2
              exit 1
            }
            # This extracted tonistiigi binfmt QEMU treats the first post-binary
            # guest argument as argv[0], so supply it before the real arguments.
            reported=$(QEMU_CPU="$QEMU_CPU" "$emulator" "$binary" synology-drive-sync --version)
            set +e
            bridge_output=$(REQUEST_METHOD=GET QUERY_STRING=action=csrf HTTP_X_SDSYNC_REQUEST=1 QEMU_CPU="$QEMU_CPU" "$emulator" "$api_binary" sdsync-dsm-api 2>&1)
            bridge_exit=$?
            set -e
          else
            reported=$("$binary" --version)
            set +e
            bridge_output=$(REQUEST_METHOD=GET QUERY_STRING=action=csrf HTTP_X_SDSYNC_REQUEST=1 "$api_binary" 2>&1)
            bridge_exit=$?
            set -e
          fi
          [[ "$reported" == 'synology-drive-sync 0.0.0' ]]
          [[ "$bridge_exit" -eq 0 ]]
          grep -Fq 'Status: 200 OK' <<<"$bridge_output"
          grep -Fq 'Content-Type: application/json; charset=utf-8' <<<"$bridge_output"
          grep -Fq '"schema":"sdsync.dsm-error.v1"' <<<"$bridge_output"
          grep -Fq '"status":401' <<<"$bridge_output"
          grep -Fq '"code":"unauthorized"' <<<"$bridge_output"
      - name: Assemble and validate installable SPK
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          SYNOLOGY_ARCH: ${{ matrix.synology_arch }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/synology-drive-sync"
          api_binary="target/$RUST_TARGET/release/sdsync-dsm-api"
          bash packaging/synology/build-spk.sh \
            --binary "$binary" \
            --api-binary "$api_binary" \
            --arch "$SYNOLOGY_ARCH" \
            --version 0.0.0 \
            --output dist
          spk="dist/synology-drive-sync-0.0.0-$SYNOLOGY_ARCH.spk"
          python3 packaging/synology/validate_spk.py \
            --binary "$binary" \
            --api-binary "$api_binary" \
            --arch "$SYNOLOGY_ARCH" \
            "$spk"
      - name: Exercise real DSM supervisor lifecycle under BusyBox
        if: matrix.synology_arch == 'x86_64'
        shell: bash
        env:
          ALPINE_IMAGE: docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
        run: >-
          docker run --rm --network none --platform linux/amd64
          --volume "$PWD:/workspace:ro"
          "$ALPINE_IMAGE"
          /bin/sh /workspace/packaging/synology/test_real_supervisor.sh
          /workspace/dist/synology-drive-sync-0.0.0-x86_64.spk

  packaging:
    name: Packaging and container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: packaging/synology/ui-src/package.json
      - name: Verify deterministic native DSM AppWindow build
        working-directory: packaging/synology/ui-src
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run build
          first_js=$(sha256sum dist/SynologyDriveSync.js | awk '{print $1}')
          first_css=$(sha256sum dist/style.css | awk '{print $1}')
          pnpm run build
          [[ "$(sha256sum dist/SynologyDriveSync.js | awk '{print $1}')" == "$first_js" ]]
          [[ "$(sha256sum dist/style.css | awk '{print $1}')" == "$first_css" ]]
          git diff --exit-code -- dist
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: packaging
      - name: Build the binary the packaging validators execute
        run: cargo build --locked
      - name: Validate shell and Docker input line endings
        run: bash .github/scripts/validate-packaging.sh
      - name: Validate Synology package templates
        run: python3 packaging/synology/validate_spk.py
      - name: Test Synology DSM UI contract
        run: python3 packaging/synology/test_synology_ui.py
      - name: Test Synology package builder and DSM lifecycle
        run: python3 packaging/synology/test_synology_package.py
      - name: Test release and coverage policy contracts
        run: >-
          python3 -m unittest discover -s .github/scripts/tests
          -p 'test_*.py' -v
      - name: Parse PowerShell packaging scripts
        shell: pwsh
        run: ./.github/scripts/validate-powershell.ps1
      - name: Validate GitHub Actions workflows
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
      - name: Validate Compose configurations
        env:
          SDSYNC_URL: https://files.example.invalid
          SDSYNC_USERNAME: ci-audit
          SDSYNC_SOURCE: ${{ github.workspace }}
          SDSYNC_REMOTE: /ci-audit
          SDSYNC_PASSWORD_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_TOTP_SECRET_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_JOBS: "2"
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.totp.yaml config --quiet
      - name: Build documented Compose image
        env:
          SDSYNC_URL: https://files.example.invalid
          SDSYNC_USERNAME: ci-audit
          SDSYNC_SOURCE: ${{ github.workspace }}
          SDSYNC_REMOTE: /ci-audit
          SDSYNC_PASSWORD_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_JOBS: "2"
          DOCKER_BUILDKIT: "1"
        run: docker compose -f compose.yaml build sync
      - name: Smoke-test hardened container entrypoint
        env:
          SDSYNC_URL: https://files.example.invalid
          SDSYNC_USERNAME: ci-audit
          SDSYNC_SOURCE: ${{ github.workspace }}
          SDSYNC_REMOTE: /ci-audit
          SDSYNC_PASSWORD_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_TOTP_SECRET_FILE: ${{ github.workspace }}/LICENSE
          SDSYNC_JOBS: "2"
        run: |
          set -euo pipefail
          reported=$(docker compose -f compose.yaml run --rm --no-deps -T sync --version)
          expected='synology-drive-sync local'
          if [[ "$reported" != "$expected" ]]; then
            echo "Compose entrypoint version did not exactly match $expected: $reported" >&2
            exit 1
          fi

          docker compose -f compose.yaml run --rm --no-deps -T \
            --entrypoint /bin/sh sync -eu -c '
              [ "$(id -u):$(id -g)" = "10001:10001" ]
              [ -r /source/LICENSE ]
              [ -s /run/secrets/sdsync_password ]
              [ -r /run/secrets/sdsync_password ]
            '

          docker compose -f compose.yaml -f compose.totp.yaml run \
            --rm --no-deps -T --entrypoint /bin/sh sync -eu -c '
              [ "$(id -u):$(id -g)" = "10001:10001" ]
              [ -r /source/LICENSE ]
              [ -s /run/secrets/sdsync_password ]
              [ -r /run/secrets/sdsync_password ]
              [ -s /run/secrets/sdsync_totp ]
              [ -r /run/secrets/sdsync_totp ]
            '

          user=$(docker image inspect synology-drive-sync:local --format '{{.Config.User}}')
          [[ "$user" == '10001:10001' ]]
