name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: 0.5.4

jobs:
  build:
    name: Build and validate documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: documentation

      - name: Install pinned mdBook with built-in search
        shell: bash
        run: |
          set -euo pipefail
          cargo install mdbook --version "$MDBOOK_VERSION" --locked
          [[ "$(mdbook --version)" == "mdbook v$MDBOOK_VERSION" ]]

      - name: Test documentation code blocks
        run: mdbook test

      - name: Validate release selector logic and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/theme/release-selector-data.js
          node --check docs/theme/release-selector.js
          node --test tests/release-selector.test.cjs

      - name: Build Rust SDK API reference
        run: cargo doc --locked --no-deps --lib -p synology-drive-sync

      - name: Build dark-first searchable book
        shell: bash
        run: |
          set -euo pipefail
          mdbook build
          mkdir -p target/site/api
          cp -R target/doc/. target/site/api/
          test -s target/site/index.html
          test -s target/site/404.html
          test -s target/site/release-selector.html
          compgen -G 'target/site/searchindex-*.js' > /dev/null
          compgen -G 'target/site/book-*.js' > /dev/null
          compgen -G 'target/site/docs/theme/sdsync-*.css' > /dev/null
          test -s target/site/api/synology_drive_sync/index.html
          grep -Fq 'const default_light_theme = "navy";' target/site/index.html
          grep -Fq 'const default_dark_theme = "navy";' target/site/index.html
          grep -Eq 'searchindex-[0-9a-f]+\.js' target/site/index.html
          grep -Fq 'SDSYNC_MAX_RATE' target/site/searchindex-*.js
          grep -Fq 'sdsync_run_v1' target/site/searchindex-*.js
          for control in purpose model dsmVersion reportedArch desktopOs desktopCpu; do
            grep -Fq "name=\"$control\"" target/site/release-selector.html
          done
          grep -Fq 'data-selector-result' target/site/release-selector.html
          if grep -Fq '&lt;fieldset' target/site/release-selector.html; then
            echo 'release selector fieldset was escaped instead of rendered' >&2
            exit 1
          fi
          grep -Fq \
            'https://github.com/supermarsx/synology-drive-sync/edit/main/docs/index.md' \
            target/site/index.html
          if grep -RFq '/edit/main/docs/docs/' target/site --include='*.html'; then
            echo 'generated edit links contain a duplicated docs path' >&2
            exit 1
          fi

      - name: Check generated local links and fragments
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline
            --include-fragments
            --no-progress
            --root-dir "${{ github.workspace }}/target/site"
            --exclude-path '[/\\]api[/\\]'
            --exclude-path '[/\\]404[.]html$'
            "${{ github.workspace }}/target/site/**/*.html"
          fail: true
          failIfEmpty: true

      - name: Upload GitHub Pages artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/site

  deploy:
    name: Deploy documentation to GitHub Pages
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        name: Deploy GitHub Pages artifact
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
