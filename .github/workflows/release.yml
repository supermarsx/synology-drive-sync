name: Calendar release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Rehearse the release without publishing anything. Builds, verifies and
          renders the changelog, but creates no GHCR tag, no attestation, no git
          tag and no GitHub Release.
        type: boolean
        default: false
        required: false

# Only one release may be in flight at a time: the calendar number is reserved
# by a draft release and not materialised as a git tag until the very last step,
# so overlapping runs would allocate the same YY.N.
#
# Known and accepted behaviour (audit H5): GitHub keeps at most ONE pending run
# per concurrency group. A burst of merges to main during a ~60 minute release
# run leaves N queued runs of which N-1 are cancelled. That is correct for a
# rolling release -- the surviving run ships a superset of the dropped commits --
# but it means individual commits do not each get their own release, and the
# released commit can lag main. The freshness guard in the `version` job below
# bounds how stale that can get.
concurrency:
  group: calendar-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Allocate calendar version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      # DELIBERATELY ELEVATED -- do not reduce this to `contents: read`.
      #
      # This job reserves the next YY.N by listing releases and looking for an
      # in-flight draft. GitHub only returns draft releases from
      # `GET /repos/{owner}/{repo}/releases` to tokens with PUSH access, and
      # `contents: read` is not push access. Under `contents: read` the draft
      # list is silently empty, which (a) makes the "resume the existing draft"
      # branch dead code and (b) stops a draft from reserving its number, so a
      # later run against a different commit allocates the same YY.N twice.
      # There is no lower-privilege lever: `contents` is the only scope that
      # governs releases, and drafts are structurally unresolvable by tag name
      # at any permission level.
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
      sha: ${{ steps.version.outputs.sha }}
      build_timestamp: ${{ steps.version.outputs.build_timestamp }}
      image: ${{ steps.version.outputs.image }}
      already_published: ${{ steps.version.outputs.already_published }}
      # 'true' only for a manual dispatch that asked for a rehearsal. A
      # workflow_run event has no `inputs` context, so this is 'false' there.
      # Rendered to an explicit literal rather than relying on how GitHub
      # stringifies a boolean: every mutation guard downstream is a string
      # comparison against 'true', and a surprise here would let a dry run
      # publish.
      dry_run: >-
        ${{ (github.event_name == 'workflow_dispatch' &&
        (inputs.dry_run == true || inputs.dry_run == 'true'))
        && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: version
        name: Select YY.N
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `grep` exits 1 when nothing matches, which is a legitimate empty
          # result for every filter below; any other status is a real failure
          # and must propagate. Audit H4: the previous `mapfile < <(...)` form
          # discarded the exit status of the whole pipeline, so an API error or
          # a jq parse failure produced an empty array and the script carried on
          # against false data. Everything below materialises to a file first.
          grep_optional() {
            local status=0
            grep -E "$1" || status=$?
            (( status <= 1 ))
          }

          git fetch --force --tags origin
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          sha=$(git rev-parse HEAD)

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            ci_runs="$RUNNER_TEMP/sdsync-ci-runs.json"
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&head_sha=$sha&per_page=100" \
              > "$ci_runs"
            if ! jq -s -e --arg sha "$sha" --arg repository "$GITHUB_REPOSITORY" '
              any(.[].workflow_runs[];
                .head_sha == $sha and
                .head_branch == "main" and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success" and
                .head_repository.full_name == $repository)
            ' "$ci_runs" >/dev/null; then
              echo "manual release refused: $sha has no successful completed CI push run on main" >&2
              exit 1
            fi
          fi

          # NOTE (audit M5): this CI-green check, and the trigger guard above
          # it, are safety rails and not security controls. A workflow_dispatch
          # runs release.yml as it exists on the dispatched ref, so anyone who
          # can push a branch can dispatch a copy with these guards removed.
          # Enforcing that requires an environment protection rule with required
          # reviewers on stage-release / publish-release / publish-image, which
          # is repository configuration and cannot be set from this file.

          release_pages="$RUNNER_TEMP/sdsync-release-pages.json"
          release_index="$RUNNER_TEMP/sdsync-release-index.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$release_pages"
          jq -s 'add // []' "$release_pages" > "$release_index"

          published_file="$RUNNER_TEMP/sdsync-published-for-sha.txt"
          jq -r '.[] | select(.draft == false) | .tag_name' "$release_index" \
            | grep_optional '^[0-9]{2}\.[1-9][0-9]*$' \
            | while read -r candidate; do
                if git rev-parse --verify --quiet "refs/tags/$candidate" >/dev/null && \
                  [[ "$(git rev-list -n 1 "$candidate")" == "$sha" ]]; then
                  printf '%s\n' "$candidate"
                fi
              done \
            | LC_ALL=C sort -V > "$published_file"
          mapfile -t published_for_sha < "$published_file"

          drafts_file="$RUNNER_TEMP/sdsync-drafts-for-sha.txt"
          jq -r --arg sha "$sha" \
            '.[] | select(.draft == true and .target_commitish == $sha) | .tag_name' \
            "$release_index" \
            | grep_optional '^[0-9]{2}\.[1-9][0-9]*$' \
            | LC_ALL=C sort -V > "$drafts_file"
          mapfile -t drafts_for_sha < "$drafts_file"

          already_published=false
          if (( ${#published_for_sha[@]} > 0 )); then
            tag=${published_for_sha[-1]}
            already_published=true
          elif (( ${#drafts_for_sha[@]} > 1 )); then
            # Audit C3: this used to exit 1 with a one-line message and no way
            # out, wedging every future run for this commit. Print exactly what
            # a human has to delete.
            {
              echo "multiple calendar-release drafts target $sha; refusing an ambiguous resume."
              echo
              echo "Offending draft releases:"
              jq -r --arg sha "$sha" '
                .[]
                | select(.draft == true
                    and .target_commitish == $sha
                    and (.tag_name | test("^[0-9]{2}\\.[1-9][0-9]*$")))
                | "  id=\(.id)  tag=\(.tag_name)  \(.html_url)"
              ' "$release_index"
              echo
              echo "Delete all but the one to keep, then re-run this workflow:"
              jq -r --arg sha "$sha" --arg repo "$GITHUB_REPOSITORY" '
                .[]
                | select(.draft == true
                    and .target_commitish == $sha
                    and (.tag_name | test("^[0-9]{2}\\.[1-9][0-9]*$")))
                | "  gh api --method DELETE repos/\($repo)/releases/\(.id)"
              ' "$release_index"
              echo
              echo "Delete by id as shown. 'gh release delete <tag>' resolves a duplicated"
              echo "tag name non-deterministically and may remove the wrong draft."
            } >&2
            exit 1
          elif (( ${#drafts_for_sha[@]} == 1 )); then
            tag=${drafts_for_sha[0]}
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null && \
              [[ "$(git rev-list -n 1 "$tag")" != "$sha" ]]; then
              echo "draft release $tag conflicts with an existing tag" >&2
              exit 1
            fi
          else
            tags_file="$RUNNER_TEMP/sdsync-tags-for-sha.txt"
            git tag --list \
              | grep_optional '^[0-9]{2}\.[1-9][0-9]*$' \
              | while read -r candidate; do
                  if [[ "$(git rev-list -n 1 "$candidate")" == "$sha" ]]; then
                    printf '%s\n' "$candidate"
                  fi
                done \
              | LC_ALL=C sort -V > "$tags_file"
            mapfile -t tags_for_sha < "$tags_file"
            if (( ${#tags_for_sha[@]} > 0 )); then
              tag=${tags_for_sha[-1]}
            else
              year=$(date -u +%y)
              year_candidates="$RUNNER_TEMP/sdsync-year-candidates.txt"
              {
                git tag --list "$year.*"
                jq -r '.[].tag_name' "$release_index"
              } > "$year_candidates"
              year_numbers="$RUNNER_TEMP/sdsync-year-numbers.txt"
              grep_optional "^${year}\.[1-9][0-9]*$" < "$year_candidates" \
                | cut -d. -f2 \
                | LC_ALL=C sort -n > "$year_numbers"
              latest=$(tail -n 1 "$year_numbers")
              tag="$year.$((${latest:-0} + 1))"
            fi
          fi

          # Audit H2: nothing above establishes that $sha is still part of main
          # or newer than what has already shipped. Re-running an old green CI
          # run re-fires workflow_run, and a workflow_dispatch only proves "this
          # commit was green on main at some point" -- true forever, including
          # for a commit that was later reverted or force-pushed away. Without
          # these two assertions such a run allocates a fresh YY.N for stale
          # code and publishes it as --latest.
          #
          # Skipped when the commit is already published: that path exists
          # precisely so a re-run of an old, successful release is a clean
          # no-op, and its commit is legitimately behind main.
          if [[ "$already_published" != true ]]; then
            main_sha=$(git rev-parse refs/remotes/origin/main)
            if ! git merge-base --is-ancestor "$sha" "$main_sha"; then
              echo "refusing to release $sha: it is not reachable from origin/main ($main_sha)" >&2
              exit 1
            fi
            newest_tags="$RUNNER_TEMP/sdsync-newest-tags.txt"
            git tag --list \
              | grep_optional '^[0-9]{2}\.[1-9][0-9]*$' \
              | LC_ALL=C sort -V > "$newest_tags"
            newest_tag=$(tail -n 1 "$newest_tags")
            if [[ -n "$newest_tag" ]]; then
              newest_commit=$(git rev-list -n 1 "$newest_tag")
              if ! git merge-base --is-ancestor "$newest_commit" "$sha"; then
                echo "refusing to release $sha: it predates the newest release $newest_tag ($newest_commit)" >&2
                echo "re-running an old CI run cannot cut a new release of stale code" >&2
                exit 1
              fi
            fi
          fi

          # Newest calendar tag reachable from $sha, excluding $sha's own tag on
          # the resume path. Empty for the first release; the notes renderer
          # turns that into "Initial release".
          prev_tag_candidates="$RUNNER_TEMP/sdsync-prev-tags.txt"
          git tag --list --merged "$sha" \
            | grep_optional '^[0-9]{2}\.[1-9][0-9]*$' \
            | LC_ALL=C sort -V > "$prev_tag_candidates"
          prev_tag=""
          while IFS= read -r candidate; do
            if [[ "$candidate" != "$tag" ]]; then
              prev_tag="$candidate"
            fi
          done < "$prev_tag_candidates"

          repository=${GITHUB_REPOSITORY,,}
          build_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "tag=$tag"
            echo "prev_tag=$prev_tag"
            echo "sha=$sha"
            echo "build_timestamp=$build_timestamp"
            echo "image=ghcr.io/$repository"
            echo "already_published=$already_published"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: $tag ($sha); previous: ${prev_tag:-<none>}; already published: $already_published"

  build-unix:
    name: Build ${{ matrix.platform }} ${{ matrix.architecture }}
    needs: version
    if: needs.version.outputs.already_published != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            architecture: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build native release binary
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify Linux ABI baseline
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/synology-drive-sync"
          glibc_file="$RUNNER_TEMP/sdsync-glibc-versions.txt"
          if ! readelf --version-info --wide "$binary" \
            | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
            | LC_ALL=C sort -Vu > "$glibc_file"; then
            echo "could not read GLIBC version requirements from $binary" >&2
            exit 1
          fi
          mapfile -t glibc_versions < "$glibc_file"
          [[ "${#glibc_versions[@]}" -gt 0 ]] || {
            echo "$binary declares no GLIBC symbol versions; refusing to ship an unverifiable ABI" >&2
            exit 1
          }
          max_glibc="${glibc_versions[${#glibc_versions[@]} - 1]#GLIBC_}"
          if [[ "$(printf '%s\n' "$max_glibc" '2.35' | LC_ALL=C sort -V | tail -n 1)" != '2.35' ]]; then
            echo "Linux binary requires GLIBC_$max_glibc; release ceiling is GLIBC_2.35" >&2
            exit 1
          fi

          needed=$(readelf --dynamic --wide "$binary" | awk '/NEEDED/ { gsub(/[\[\]]/, "", $NF); print $NF }')
          printf 'Maximum GLIBC version: GLIBC_%s\nDynamic dependencies:\n%s\n' "$max_glibc" "$needed"
          if grep -Eq '^(libsecret|libdbus|libssl|libcrypto)' <<<"$needed"; then
            echo 'Linux release unexpectedly links a forbidden native vault or TLS library' >&2
            exit 1
          fi
      - name: Assemble archive
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          archive_root="synology-drive-sync-$TAG-$PLATFORM-$ARCHITECTURE"
          package_root="package/$archive_root"
          binary="target/$TARGET/release/synology-drive-sync"
          mkdir -p "$package_root/completions" "$package_root/man"
          install -m 0755 "$binary" "$package_root/synology-drive-sync"
          install -m 0644 LICENSE README.md SECURITY.md THIRD_PARTY_LICENSES.html "$package_root/"
          "$binary" completions bash > "$package_root/completions/synology-drive-sync.bash"
          "$binary" completions zsh > "$package_root/completions/_synology-drive-sync"
          "$binary" completions fish > "$package_root/completions/synology-drive-sync.fish"
          "$binary" completions powershell > "$package_root/completions/synology-drive-sync.ps1"
          "$binary" completions elvish > "$package_root/completions/synology-drive-sync.elv"
          if ! "$binary" manpage --all "$package_root/man"; then
            echo 'recursive manpage generation failed' >&2
            exit 1
          fi
          reported=$("$binary" --version)
          expected="synology-drive-sync $TAG"
          [[ "$reported" == "$expected" ]] || {
            echo "binary version did not exactly match $expected: $reported" >&2
            exit 1
          }
          tar -czf "$archive_root.tar.gz" -C package "$archive_root"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: synology-drive-sync-${{ needs.version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build windows ${{ matrix.architecture }}
    needs: version
    if: needs.version.outputs.already_published != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            architecture: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build native release binary
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Assemble archive
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "synology-drive-sync-$env:TAG-windows-$env:ARCHITECTURE"
          $packageRoot = Join-Path 'package' $root
          $completionRoot = Join-Path $packageRoot 'completions'
          $manRoot = Join-Path $packageRoot 'man'
          New-Item -ItemType Directory -Path $completionRoot, $manRoot | Out-Null
          $binary = Join-Path "target/$env:TARGET/release" 'synology-drive-sync.exe'
          Copy-Item -LiteralPath $binary -Destination $packageRoot
          Copy-Item -LiteralPath LICENSE, README.md, SECURITY.md, THIRD_PARTY_LICENSES.html -Destination $packageRoot
          & $binary completions bash | Out-File (Join-Path $completionRoot 'synology-drive-sync.bash') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'bash completion generation failed' }
          & $binary completions zsh | Out-File (Join-Path $completionRoot '_synology-drive-sync') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'zsh completion generation failed' }
          & $binary completions fish | Out-File (Join-Path $completionRoot 'synology-drive-sync.fish') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'fish completion generation failed' }
          & $binary completions powershell | Out-File (Join-Path $completionRoot 'synology-drive-sync.ps1') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell completion generation failed' }
          & $binary completions elvish | Out-File (Join-Path $completionRoot 'synology-drive-sync.elv') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Elvish completion generation failed' }
          & $binary manpage --all $manRoot
          if ($LASTEXITCODE -ne 0) { throw 'recursive manpage generation failed' }
          $reportedLines = @(& $binary --version)
          $versionExitCode = $LASTEXITCODE
          $expected = "synology-drive-sync $env:TAG"
          if ($versionExitCode -ne 0 -or
              $reportedLines.Count -ne 1 -or
              ([string] $reportedLines[0]) -cne $expected) {
            $reported = $reportedLines -join "`n"
            throw "binary version did not exactly match ${expected}: $reported"
          }
          Compress-Archive -Path $packageRoot -DestinationPath "$root.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-${{ matrix.architecture }}
          path: synology-drive-sync-${{ needs.version.outputs.tag }}-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 7

  build-synology:
    name: Build Synology DSM ${{ matrix.synology_arch }}
    needs: version
    if: needs.version.outputs.already_published != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            synology_arch: x86_64
            elf_machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            synology_arch: armv8
            elf_machine: AArch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools
      - name: Build DSM-portable static binary
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
          RUST_TARGET: ${{ matrix.rust_target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target "$RUST_TARGET"
      - name: Verify DSM binary architecture and static linkage
        shell: bash
        env:
          ELF_MACHINE: ${{ matrix.elf_machine }}
          RUST_TARGET: ${{ matrix.rust_target }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/synology-drive-sync"
          machine=$(readelf --file-header --wide "$binary" | awk -F: '/Machine:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
          [[ "$machine" == "$ELF_MACHINE" ]] || {
            echo "unexpected ELF machine: $machine (expected $ELF_MACHINE)" >&2
            exit 1
          }
          if readelf --program-headers --wide "$binary" | grep -q 'INTERP'; then
            echo 'DSM binary must not require a host ELF interpreter' >&2
            exit 1
          fi
          if readelf --dynamic --wide "$binary" 2>/dev/null | grep -q 'NEEDED'; then
            echo 'DSM binary must not require host dynamic libraries' >&2
            exit 1
          fi
          reported=$("$binary" --version)
          expected="synology-drive-sync $TAG"
          [[ "$reported" == "$expected" ]] || {
            echo "DSM binary version did not exactly match $expected: $reported" >&2
            exit 1
          }
      - name: Assemble and validate installable SPK
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          SYNOLOGY_ARCH: ${{ matrix.synology_arch }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/synology-drive-sync"
          bash packaging/synology/build-spk.sh \
            --binary "$binary" \
            --arch "$SYNOLOGY_ARCH" \
            --version "$TAG" \
            --output dist
          spk="dist/synology-drive-sync-$TAG-$SYNOLOGY_ARCH.spk"
          python3 packaging/synology/validate_spk.py \
            --binary "$binary" \
            --arch "$SYNOLOGY_ARCH" \
            "$spk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-synology-${{ matrix.synology_arch }}
          path: dist/synology-drive-sync-${{ needs.version.outputs.tag }}-${{ matrix.synology_arch }}.spk
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: Dependency SBOM
    needs: version
    if: needs.version.outputs.already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - name: Generate CycloneDX JSON
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]{2}\.[1-9][0-9]*$ ]] || {
            echo "refusing to build an SBOM for a malformed calendar tag: $TAG" >&2
            exit 1
          }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "unexpected repository slug: $REPOSITORY" >&2
            exit 1
          }
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx -f json --all-features --target all
          source_sbom=$(find . -maxdepth 2 -type f -name '*.cdx.json' -print -quit)
          [[ -n "$source_sbom" ]] || {
            echo 'cargo-cyclonedx produced no *.cdx.json document' >&2
            exit 1
          }
          old_ref=$(jq -er '.metadata.component["bom-ref"] | select(type == "string" and length > 0)' "$source_sbom")
          old_purl=$(jq -er '.metadata.component.purl | select(type == "string" and length > 0)' "$source_sbom")
          root_purl="pkg:github/$REPOSITORY@$TAG"
          # cargo-cyclonedx omits the random serial number whenever SOURCE_DATE_EPOCH
          # is set, but actions/attest only recognises a CycloneDX document that
          # carries bomFormat, specVersion and serialNumber. Derive a stable UUIDv5
          # so the SBOM stays byte-reproducible and remains attestable.
          serial="urn:uuid:$(
            python3 -c 'import sys, uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, sys.argv[1]))' \
              "https://github.com/$REPOSITORY/releases/tag/$TAG"
          )"
          [[ "$serial" =~ ^urn:uuid:[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]] || {
            echo "derived SBOM serial number is malformed: $serial" >&2
            exit 1
          }
          normalized=$(mktemp)
          trap 'rm -f -- "$normalized"' EXIT
          jq \
            --arg tag "$TAG" \
            --arg old_ref "$old_ref" \
            --arg old_purl "$old_purl" \
            --arg root_purl "$root_purl" \
            --arg serial "$serial" '
              def reprefix($old; $new):
                if type == "string" and startswith($old)
                then $new + .[($old | length):]
                else .
                end;
              walk(reprefix($old_ref; $root_purl) | reprefix($old_purl; $root_purl))
              | .serialNumber = $serial
              | .metadata.component.version = $tag
              | .metadata.component.purl = $root_purl
              | .metadata.component["bom-ref"] = $root_purl
              | .metadata.component.components |= map(.version = $tag)
            ' "$source_sbom" > "$normalized"
          mv "$normalized" "synology-drive-sync-$TAG.cdx.json"
          jq -e \
            --arg tag "$TAG" \
            --arg old_ref "$old_ref" \
            --arg old_purl "$old_purl" \
            --arg root_purl "$root_purl" \
            --arg serial "$serial" '
              ([.metadata.component, .components[]?]
                | [.[] | recurse(.components[]?) | .["bom-ref"]]
                | unique) as $component_refs
              |
              .bomFormat == "CycloneDX"
              and .serialNumber == $serial
              and ((.specVersion | type) == "string")
              and ((.specVersion | length) > 0)
              and ((.components | type) == "array")
              and any(.metadata.properties[]?;
                .name == "cdx:rustc:sbom:target:all_targets" and .value == "true")
              and .metadata.component.name == "synology-drive-sync"
              and .metadata.component.version == $tag
              and .metadata.component.purl == $root_purl
              and .metadata.component["bom-ref"] == $root_purl
              and ((.metadata.component.components | type) == "array")
              and ((.metadata.component.components | length) > 0)
              and all(.metadata.component.components[];
                .version == $tag
                and (.purl | startswith($root_purl))
                and (.["bom-ref"] | startswith($root_purl)))
              and any(.dependencies[]; .ref == $root_purl)
              and all(.dependencies[]?;
                (.ref as $ref | $component_refs | index($ref)) != null
                and all(.dependsOn[]?;
                  . as $ref | ($component_refs | index($ref)) != null))
              and ([.. | strings | select(startswith($old_ref) or startswith($old_purl))] | length) == 0
            ' "synology-drive-sync-$TAG.cdx.json" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: synology-drive-sync-${{ needs.version.outputs.tag }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  image:
    name: Build image ${{ matrix.architecture }}
    needs: version
    if: needs.version.outputs.already_published != 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: Log in to GHCR
        # MUTATION GUARD: a dry run builds locally and never touches a registry,
        # so it needs no credentials at all.
        if: needs.version.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Create native BuildKit builder
        shell: bash
        run: |
          docker buildx create --name release-builder --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Build and verify architecture image
        shell: bash
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          CREATED: ${{ needs.version.outputs.build_timestamp }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
          DRY_RUN: ${{ needs.version.outputs.dry_run }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/sdsync-image-metadata.json"

          # Audit H1/M1: this used to push $IMAGE:$TAG-$ARCH, leaving a permanent
          # public per-architecture tag behind on any later failure and never
          # removing it after the manifest was assembled. Push by digest with no
          # tag instead: an abandoned run leaves only untagged blobs, which GHCR
          # garbage-collects, and nothing is publicly addressable until
          # publish-image assembles the manifest.
          build_args=(
            buildx build
            --platform "$PLATFORM"
            --build-arg "VERSION=$TAG"
            --build-arg "VCS_REF=$SHA"
            --build-arg "BUILD_DATE=$CREATED"
            --label "org.opencontainers.image.created=$CREATED"
            --label "org.opencontainers.image.revision=$SHA"
            --label "org.opencontainers.image.version=$TAG"
          )

          if [[ "$DRY_RUN" == "true" ]]; then
            # MUTATION GUARD: no --push and no registry output. The docker
            # exporter cannot carry attestations, so provenance and SBOM
            # generation are disabled on this path only -- every other build
            # argument is identical to the published path below, so the rehearsal
            # still exercises the real Dockerfile and the real version check.
            build_args+=(
              --provenance=false
              --sbom=false
              --tag "sdsync-dry-run:$ARCHITECTURE"
              --load
            )
            docker "${build_args[@]}" .
            image_ref="sdsync-dry-run:$ARCHITECTURE"
          else
            build_args+=(
              --provenance=mode=max
              --sbom=true
              --metadata-file "$metadata"
              --output "type=image,name=$IMAGE,name-canonical=true,push-by-digest=true,push=true"
            )
            docker "${build_args[@]}" .
            digest=$(jq -r '."containerimage.digest" // empty' "$metadata")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "buildx did not report a usable image digest: '${digest:-<empty>}'" >&2
              exit 1
            }
            printf '%s\n' "$digest" > "image-digest-$ARCHITECTURE.txt"
            image_ref="$IMAGE@$digest"
          fi

          reported=$(docker run --rm "$image_ref" --version)
          expected="synology-drive-sync $TAG"
          [[ "$reported" == "$expected" ]] || {
            echo "image binary version did not exactly match $expected: $reported" >&2
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.dry_run != 'true'
        with:
          # Matrix legs share one `outputs:` block and would clobber each other,
          # so each architecture hands its digest to publish-image as a
          # distinctly named artifact.
          name: image-digest-${{ matrix.architecture }}
          path: image-digest-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 7

  stage-release:
    name: Stage GitHub Release draft
    needs: [version, build-unix, build-windows, build-synology, sbom, image]
    if: needs.version.outputs.already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - id: release_state
        name: Resolve release state
        # Audit H3: this guard used to live BELOW the three attest steps, so a
        # run that was going to be refused for touching an already-published
        # release had already minted permanent, unretractable attestations for a
        # rebuilt artifact set. The check now runs first and fails closed.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          # Audit C1: `GET /repos/{owner}/{repo}/releases/tags/{tag}` returns
          # PUBLISHED releases only. A draft has no git tag and is structurally
          # unresolvable by tag name at any permission level, so the previous
          # lookup 404'd on every first run -- after the draft had already been
          # created. List releases and select by tag_name instead, then address
          # the release by .id from here on.
          release_pages="$RUNNER_TEMP/sdsync-stage-release-pages.json"
          matches="$RUNNER_TEMP/sdsync-stage-release-matches.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$release_pages"
          jq -s --arg tag "$TAG" 'add // [] | map(select(.tag_name == $tag))' \
            "$release_pages" > "$matches"
          match_count=$(jq 'length' "$matches")

          if (( match_count > 1 )); then
            {
              echo "$match_count releases carry the tag name $TAG; refusing an ambiguous resume."
              echo
              echo "Offending releases:"
              jq -r '.[] | "  id=\(.id)  draft=\(.draft)  target=\(.target_commitish)  \(.html_url)"' "$matches"
              echo
              echo "Delete all but the one to keep, then re-run this workflow:"
              jq -r --arg repo "$GITHUB_REPOSITORY" \
                '.[] | "  gh api --method DELETE repos/\($repo)/releases/\(.id)"' "$matches"
              echo
              echo "Delete by id as shown. 'gh release delete \"$TAG\"' resolves a duplicated"
              echo "tag name non-deterministically and may remove the wrong release."
            } >&2
            exit 1
          fi

          tag_matches=false
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tagged_sha=$(git rev-list -n 1 "$TAG")
            [[ "$tagged_sha" == "$SHA" ]] || {
              echo "tag $TAG already points to $tagged_sha, expected $SHA" >&2
              exit 1
            }
            tag_matches=true
          fi

          release_id=
          if (( match_count == 1 )); then
            release_id=$(jq -r '.[0].id' "$matches")
            draft=$(jq -r '.[0].draft' "$matches")
            target=$(jq -r '.[0].target_commitish' "$matches")
            if [[ "$draft" != true ]]; then
              [[ "$tag_matches" == true ]] || {
                echo "published release $TAG does not resolve to expected commit $SHA" >&2
                exit 1
              }
              echo "release $TAG is already published; refusing to modify immutable assets" >&2
              exit 1
            fi
            if [[ "$tag_matches" != true && "$target" != "$SHA" ]]; then
              echo "draft release $TAG (id $release_id) targets $target, expected $SHA" >&2
              exit 1
            fi
            echo "resuming draft release $TAG (id $release_id)"
          else
            echo "no release carries tag $TAG yet; a draft will be created"
          fi

          {
            echo "release_id=$release_id"
            echo "tag_matches=$tag_matches"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare checksums and installer assets
        env:
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 packaging/install.sh dist/install.sh
          install -m 0644 packaging/install.ps1 dist/install.ps1
          install -m 0644 THIRD_PARTY_LICENSES.html dist/THIRD_PARTY_LICENSES.html
          python3 packaging/synology/validate_spk.py \
            --arch armv8 \
            "dist/synology-drive-sync-$TAG-armv8.spk"
          python3 packaging/synology/validate_spk.py \
            --arch x86_64 \
            "dist/synology-drive-sync-$TAG-x86_64.spk"
          cd dist
          expected_archives=(
            "synology-drive-sync-$TAG-armv8.spk"
            "synology-drive-sync-$TAG-linux-aarch64.tar.gz"
            "synology-drive-sync-$TAG-linux-x86_64.tar.gz"
            "synology-drive-sync-$TAG-macos-aarch64.tar.gz"
            "synology-drive-sync-$TAG-macos-x86_64.tar.gz"
            "synology-drive-sync-$TAG-windows-aarch64.zip"
            "synology-drive-sync-$TAG-windows-x86_64.zip"
            "synology-drive-sync-$TAG-x86_64.spk"
          )
          # Audit M2: the literal list above is in C byte order, so every sort
          # compared against it must be too, or the diff fails under any
          # collating locale.
          archive_list="$RUNNER_TEMP/sdsync-actual-archives.txt"
          find . -maxdepth 1 -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.spk' \) \
            -printf '%f\n' \
            | LC_ALL=C sort > "$archive_list"
          mapfile -t actual_archives < "$archive_list"
          diff -u \
            <(printf '%s\n' "${expected_archives[@]}") \
            <(printf '%s\n' "${actual_archives[@]}")
          archives=("${expected_archives[@]}")
          sbom="synology-drive-sync-$TAG.cdx.json"
          [[ -f "$sbom" ]] || {
            echo "expected SBOM $sbom is missing from the downloaded artifacts" >&2
            exit 1
          }
          LC_ALL=C sha256sum -- "${archives[@]}" > ARCHIVE_SHA256SUMS
          release_inputs=("${archives[@]}" "$sbom" THIRD_PARTY_LICENSES.html install.sh install.ps1)
          # Audit M3: the LC_ALL=C prefix binds only to sha256sum, so the sort
          # that actually determines line order needs its own.
          LC_ALL=C sha256sum -- "${release_inputs[@]}" \
            | LC_ALL=C sort -k2 > SHA256SUMS
      - name: Render release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PREV_TAG: ${{ needs.version.outputs.prev_tag }}
          SHA: ${{ needs.version.outputs.sha }}
          DRY_RUN: ${{ needs.version.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/sdsync-release-notes.md"
          bash .github/scripts/render-release-notes.sh \
            "$PREV_TAG" "$SHA" "$TAG" "$notes"
          {
            if [[ "$DRY_RUN" == "true" ]]; then
              printf '# DRY RUN -- nothing below has been published\n\n'
            fi
            printf '# Release notes preview: %s\n\n' "$TAG"
            cat -- "$notes"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Rendered release notes for %s (previous tag: %s)\n' \
            "$TAG" "${PREV_TAG:-<none>}"
      - name: Attest release provenance
        # MUTATION GUARD: attestations are permanent and publicly verifiable and
        # this workflow cannot un-mint them. A dry run must never create one.
        if: needs.version.outputs.dry_run != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest dependency SBOM
        # MUTATION GUARD: see above.
        if: needs.version.outputs.dry_run != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/ARCHIVE_SHA256SUMS
          sbom-path: dist/synology-drive-sync-${{ needs.version.outputs.tag }}.cdx.json
      - name: Attest checksum manifest
        # MUTATION GUARD: see above.
        if: needs.version.outputs.dry_run != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/SHA256SUMS
      - id: assets
        name: Verify the release asset set
        shell: bash
        run: |
          set -euo pipefail
          # ARCHIVE_SHA256SUMS exists only as an attestation subject list and is
          # never a release asset.
          rm dist/ARCHIVE_SHA256SUMS
          asset_list="$RUNNER_TEMP/sdsync-assets.bin"
          find dist -maxdepth 1 -type f -print0 | LC_ALL=C sort -z > "$asset_list"
          mapfile -d '' -t assets < "$asset_list"
          # Audit M4: a bare `[[ ... ]]` here failed with no output at all, in a
          # job that had already minted three attestations.
          [[ ${#assets[@]} -eq 13 ]] || {
            printf 'expected 13 release assets, found %d:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          }
          printf '%s\n' "${assets[@]}"
      - id: draft
        name: Create or resume the draft release
        # MUTATION GUARD: creates the draft release. A draft does not create a
        # git tag, but it does consume a calendar number.
        if: needs.version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          RELEASE_ID: ${{ steps.release_state.outputs.release_id }}
          TAG_MATCHES: ${{ steps.release_state.outputs.tag_matches }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/sdsync-release-notes.md"
          release_id="$RELEASE_ID"

          if [[ -z "$release_id" ]]; then
            # --generate-notes is kept alongside --notes-file: GitHub appends its
            # contributor and compare block, and the "What's Changed" section
            # fills itself in automatically if a PR-based history is adopted.
            if [[ "$TAG_MATCHES" == true ]]; then
              gh release create "$TAG" \
                --draft \
                --verify-tag \
                --title "synology-drive-sync $TAG" \
                --notes-file "$notes" \
                --generate-notes
            else
              gh release create "$TAG" \
                --draft \
                --target "$SHA" \
                --title "synology-drive-sync $TAG" \
                --notes-file "$notes" \
                --generate-notes
            fi

            # Re-resolve to learn the new id. Still list-and-filter: the release
            # is a draft, so releases/tags/{tag} cannot see it.
            created_pages="$RUNNER_TEMP/sdsync-created-pages.json"
            created="$RUNNER_TEMP/sdsync-created.json"
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > "$created_pages"
            jq -s --arg tag "$TAG" 'add // [] | map(select(.tag_name == $tag))' \
              "$created_pages" > "$created"
            created_count=$(jq 'length' "$created")
            (( created_count == 1 )) || {
              echo "expected exactly 1 release named $TAG after creating it, found $created_count" >&2
              jq -r '.[] | "  id=\(.id)  draft=\(.draft)  \(.html_url)"' "$created" >&2
              exit 1
            }
            release_id=$(jq -r '.[0].id' "$created")
          fi

          state="$RUNNER_TEMP/sdsync-draft-state.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$state"
          [[ "$(jq -r '.draft' "$state")" == true ]] || {
            echo "release $TAG (id $release_id) is not a draft; refusing to stage assets onto it" >&2
            exit 1
          }
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "staged draft release $TAG (id $release_id)"
      - name: Upload and verify draft assets
        # MUTATION GUARD: uploads release assets.
        if: needs.version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          asset_list="$RUNNER_TEMP/sdsync-assets.bin"
          mapfile -d '' -t assets < "$asset_list"

          # `gh release upload` addresses a release by tag. That is safe here
          # only because the step above proved exactly one release carries this
          # tag name; with duplicates gh picks a match non-deterministically.
          gh release upload "$TAG" "${assets[@]}" --clobber

          local_list="$RUNNER_TEMP/sdsync-local-asset-names.txt"
          for asset_path in "${assets[@]}"; do
            basename -- "$asset_path"
          done | LC_ALL=C sort > "$local_list"
          mapfile -t local_names < "$local_list"

          remote_list="$RUNNER_TEMP/sdsync-remote-asset-names.txt"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[].name' \
            | LC_ALL=C sort > "$remote_list"
          mapfile -t remote_names < "$remote_list"

          diff -u \
            <(printf '%s\n' "${local_names[@]}") \
            <(printf '%s\n' "${remote_names[@]}")
      - name: Collect the dry-run bundle
        if: needs.version.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dry-run
          cp -r dist dry-run/assets
          cp -- "$RUNNER_TEMP/sdsync-release-notes.md" dry-run/RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.dry_run == 'true'
        with:
          # The dry run publishes nothing, so the exact asset set it would have
          # published -- plus the rendered changelog -- is preserved here for
          # inspection instead.
          name: dry-run-release-bundle
          path: dry-run
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish immutable GitHub Release
    # Audit H1: publication now happens BEFORE the mutable GHCR tags are
    # created, so :latest can never advertise a version that has no GitHub
    # release, no git tag and no checksums.
    needs: [version, stage-release]
    # MUTATION GUARD: the whole job creates the git tag and publishes the
    # release, so a dry run skips it entirely.
    if: >-
      needs.version.outputs.already_published != 'true' &&
      needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: Publish verified draft exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail

          # Audit C1: resolve draft-aware and by id, never by tag name.
          release_pages="$RUNNER_TEMP/sdsync-final-pages.json"
          matches="$RUNNER_TEMP/sdsync-final-matches.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$release_pages"
          jq -s --arg tag "$TAG" 'add // [] | map(select(.tag_name == $tag))' \
            "$release_pages" > "$matches"
          match_count=$(jq 'length' "$matches")

          if (( match_count == 0 )); then
            echo "no release carries the tag name $TAG; stage-release did not leave a draft" >&2
            exit 1
          fi
          if (( match_count > 1 )); then
            {
              echo "$match_count releases carry the tag name $TAG; refusing to guess which to publish."
              echo
              echo "Offending releases:"
              jq -r '.[] | "  id=\(.id)  draft=\(.draft)  target=\(.target_commitish)  \(.html_url)"' "$matches"
              echo
              echo "Delete all but the one to keep, then re-run this workflow:"
              jq -r --arg repo "$GITHUB_REPOSITORY" \
                '.[] | "  gh api --method DELETE repos/\($repo)/releases/\(.id)"' "$matches"
            } >&2
            exit 1
          fi

          release_id=$(jq -r '.[0].id' "$matches")
          if [[ -n "$RELEASE_ID" && "$RELEASE_ID" != "$release_id" ]]; then
            echo "release id changed between staging ($RELEASE_ID) and publication ($release_id)" >&2
            exit 1
          fi

          release_json="$RUNNER_TEMP/sdsync-final-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          [[ "$(jq -r '.draft' "$release_json")" == true ]] || {
            echo "release $TAG (id $release_id) is no longer a draft; refusing a second publication" >&2
            exit 1
          }
          target=$(jq -r '.target_commitish' "$release_json")
          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tagged_sha=$(git rev-list -n 1 "$TAG")
            [[ "$tagged_sha" == "$SHA" ]] || {
              echo "tag $TAG points to $tagged_sha, expected $SHA" >&2
              exit 1
            }
          elif [[ "$target" != "$SHA" ]]; then
            echo "draft release $TAG targets $target, expected $SHA" >&2
            exit 1
          fi

          remote_list="$RUNNER_TEMP/sdsync-final-asset-names.txt"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[].name' \
            | LC_ALL=C sort > "$remote_list"
          mapfile -t remote_names < "$remote_list"
          # This literal list is in C byte order; the sort above must match it.
          expected_names=(
            SHA256SUMS
            THIRD_PARTY_LICENSES.html
            install.ps1
            install.sh
            "synology-drive-sync-$TAG-armv8.spk"
            "synology-drive-sync-$TAG-linux-aarch64.tar.gz"
            "synology-drive-sync-$TAG-linux-x86_64.tar.gz"
            "synology-drive-sync-$TAG-macos-aarch64.tar.gz"
            "synology-drive-sync-$TAG-macos-x86_64.tar.gz"
            "synology-drive-sync-$TAG-windows-aarch64.zip"
            "synology-drive-sync-$TAG-windows-x86_64.zip"
            "synology-drive-sync-$TAG-x86_64.spk"
            "synology-drive-sync-$TAG.cdx.json"
          )
          diff -u \
            <(printf '%s\n' "${expected_names[@]}") \
            <(printf '%s\n' "${remote_names[@]}")

          # MUTATION: publishing the draft is what creates the git tag.
          # Addressed by id, not by tag name -- a draft cannot be resolved by
          # tag, and gh's own fallback is non-deterministic across duplicates.
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f make_latest=true > /dev/null

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          [[ "$(jq -r '.draft' "$release_json")" == false ]] || {
            echo "release $TAG (id $release_id) is still a draft after publication" >&2
            exit 1
          }
          git fetch --force --tags origin
          published_sha=$(git rev-list -n 1 "$TAG")
          [[ "$published_sha" == "$SHA" ]] || {
            echo "published tag $TAG resolves to $published_sha, expected $SHA" >&2
            exit 1
          }
          echo "published release $TAG (id $release_id) at $SHA"

  publish-image:
    name: Publish multi-architecture image
    # Audit H1: runs only after the GitHub Release is live, so :latest and :TAG
    # can never point at an unreleased build.
    #
    # Failure here leaves a published release whose container tags are missing.
    # Recovery is "Re-run failed jobs" on this same workflow run: the per-arch
    # digests are workflow artifacts and stay available for 7 days. A fresh run
    # of the whole workflow will NOT repair it -- already_published short-circuits
    # every job. Re-run the job, do not re-trigger the workflow.
    needs: [version, stage-release, sbom, image, publish-release]
    # MUTATION GUARD: creates the public GHCR tags and pushes two attestations.
    if: >-
      needs.version.outputs.already_published != 'true' &&
      needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-sbom
          path: sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Create manifest and immutable tags
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          amd64=$(cat digests/image-digest-amd64.txt)
          arm64=$(cat digests/image-digest-arm64.txt)
          for digest in "$amd64" "$arm64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "per-architecture digest is malformed: '$digest'" >&2
              exit 1
            }
          done
          # Guards against the two matrix legs handing over the same digest,
          # which would silently produce a manifest with two identical platforms.
          [[ "$amd64" != "$arm64" ]] || {
            echo "amd64 and arm64 report the same digest $amd64; refusing to build the manifest" >&2
            exit 1
          }

          metadata="$RUNNER_TEMP/sdsync-image-metadata.json"
          docker buildx imagetools create \
            --metadata-file "$metadata" \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$amd64" \
            "$IMAGE@$arm64"

          index="$RUNNER_TEMP/sdsync-image-index.json"
          docker buildx imagetools inspect --raw "$IMAGE:$TAG" > "$index"
          jq -e '
            [.manifests[]
              | select((.platform.os // "unknown") != "unknown")
              | "\(.platform.os)/\(.platform.architecture)"]
            | sort == ["linux/amd64", "linux/arm64"]
          ' "$index" > /dev/null || {
            echo "manifest for $IMAGE:$TAG does not contain exactly linux/amd64 and linux/arm64:" >&2
            jq -r '.manifests[] | "  \(.platform.os // "?")/\(.platform.architecture // "?") \(.digest)"' \
              "$index" >&2
            exit 1
          }
          docker buildx imagetools inspect "$IMAGE:$TAG"
      - id: digest
        name: Resolve manifest digest
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/sdsync-image-metadata.json"
          digest=$(jq -r '."containerimage.descriptor".digest // empty' "$metadata")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "imagetools did not report a usable manifest digest: '${digest:-<empty>}'" >&2
            exit 1
          }
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.version.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
      - name: Attest image dependency SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.version.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.value }}
          sbom-path: sbom/synology-drive-sync-${{ needs.version.outputs.tag }}.cdx.json
          push-to-registry: true
