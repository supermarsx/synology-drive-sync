name: Calendar release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Rehearse the release without publishing anything. Builds, verifies and
          renders the changelog, but creates no GHCR tag, no attestation, no git
          tag and no GitHub Release.
        type: boolean
        default: false
        required: false

# Only one release may be in flight at a time: the calendar number is reserved
# by a draft release and not materialised as a git tag until the very last step,
# so overlapping runs would allocate the same YY.N.
#
# Known and accepted behaviour (audit H5): GitHub keeps at most ONE pending run
# per concurrency group. Eligible automatic releases and manual dispatches share
# the serial group, preserving rolling-release behaviour during a burst of main
# pushes. Ineligible workflow completions use their own run-ID group so they
# cannot displace an eligible pending release before the `version` job evaluates
# its matching guard below.
concurrency:
  group: >-
    ${{
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
      && 'calendar-release'
      || format('calendar-release-ineligible-{0}', github.run_id)
    }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Allocate calendar version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      # DELIBERATELY ELEVATED -- do not reduce this to `contents: read`.
      #
      # This job reserves the next YY.N by listing releases and looking for an
      # in-flight draft. GitHub only returns draft releases from
      # `GET /repos/{owner}/{repo}/releases` to tokens with PUSH access, and
      # `contents: read` is not push access. Under `contents: read` the draft
      # list is silently empty, which (a) makes the "resume the existing draft"
      # branch dead code and (b) stops a draft from reserving its number, so a
      # later run against a different commit allocates the same YY.N twice.
      # There is no lower-privilege lever: `contents` is the only scope that
      # governs releases, and drafts are structurally unresolvable by tag name
      # at any permission level.
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prev_tag: ${{ steps.version.outputs.prev_tag }}
      sha: ${{ steps.version.outputs.sha }}
      build_timestamp: ${{ steps.version.outputs.build_timestamp }}
      image: ${{ steps.version.outputs.image }}
      already_published: ${{ steps.version.outputs.already_published }}
      # 'true' only for a manual dispatch that asked for a rehearsal. A
      # workflow_run event has no `inputs` context, so this is 'false' there.
      # Rendered to an explicit literal rather than relying on how GitHub
      # stringifies a boolean: every mutation guard downstream is a string
      # comparison against 'true', and a surprise here would let a dry run
      # publish.
      dry_run: >-
        ${{ (github.event_name == 'workflow_dispatch' &&
        (inputs.dry_run == true || inputs.dry_run == 'true'))
        && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: version
        name: Select YY.N
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `grep` exits 1 when nothing matches, which is a legitimate empty
          # result for the tag filter below; any other status is a real failure.
          grep_optional() {
            local status=0
            grep -E "$1" || status=$?
            (( status <= 1 ))
          }

          git fetch --force --tags origin
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          sha=$(git rev-parse HEAD)

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            ci_runs="$RUNNER_TEMP/sdsync-ci-runs.json"
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=completed&head_sha=$sha&per_page=100" \
              > "$ci_runs"
            if ! jq -s -e --arg sha "$sha" --arg repository "$GITHUB_REPOSITORY" '
              any(.[].workflow_runs[];
                .head_sha == $sha and
                .head_branch == "main" and
                .event == "push" and
                .status == "completed" and
                .conclusion == "success" and
                .head_repository.full_name == $repository)
            ' "$ci_runs" >/dev/null; then
              echo "manual release refused: $sha has no successful completed CI push run on main" >&2
              exit 1
            fi
          fi

          # NOTE (audit M5): this CI-green check, and the trigger guard above
          # it, are safety rails and not security controls. A workflow_dispatch
          # runs release.yml as it exists on the dispatched ref, so anyone who
          # can push a branch can dispatch a copy with these guards removed.
          # Enforcing that requires an environment protection rule with required
          # reviewers on stage-release / publish-release / publish-image, which
          # is repository configuration and cannot be set from this file.

          release_pages="$RUNNER_TEMP/sdsync-release-pages.json"
          release_index="$RUNNER_TEMP/sdsync-release-index.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$release_pages"
          jq -s 'add // []' "$release_pages" > "$release_index"

          # Normalize git state once, then make every calendar-tag and stale-run
          # decision in the fixture-tested helper. A merge-base exit status of
          # 1 means "not an ancestor"; anything else is an infrastructure error.
          calendar_tags="$RUNNER_TEMP/sdsync-calendar-tags.txt"
          git tag --list \
            | grep_optional '^[0-9]{2}\.[1-9][0-9]*$' \
            | LC_ALL=C sort -V > "$calendar_tags"
          tag_index="$RUNNER_TEMP/sdsync-tag-index.json"
          printf '[]\n' > "$tag_index"
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            candidate_sha=$(git rev-list -n 1 "$candidate")
            ancestor_status=0
            git merge-base --is-ancestor "$candidate_sha" "$sha" || ancestor_status=$?
            case "$ancestor_status" in
              0) ancestor=true ;;
              1) ancestor=false ;;
              *) echo "could not compare tag $candidate with $sha" >&2; exit "$ancestor_status" ;;
            esac
            next_tag_index="$RUNNER_TEMP/sdsync-tag-index-next.json"
            jq \
              --arg name "$candidate" \
              --arg sha "$candidate_sha" \
              --argjson ancestor "$ancestor" \
              '. + [{name: $name, sha: $sha, ancestor_of_sha: $ancestor}]' \
              "$tag_index" > "$next_tag_index"
            mv "$next_tag_index" "$tag_index"
          done < "$calendar_tags"

          main_sha=$(git rev-parse refs/remotes/origin/main)
          main_status=0
          git merge-base --is-ancestor "$sha" "$main_sha" || main_status=$?
          case "$main_status" in
            0) sha_reachable=true ;;
            1) sha_reachable=false ;;
            *) echo "could not compare $sha with origin/main ($main_sha)" >&2; exit "$main_status" ;;
          esac

          selection_input="$RUNNER_TEMP/sdsync-version-input.json"
          selection="$RUNNER_TEMP/sdsync-version.json"
          jq -n \
            --arg sha "$sha" \
            --arg main_sha "$main_sha" \
            --argjson sha_reachable "$sha_reachable" \
            --arg year "$(date -u +%y)" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg build_timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile releases "$release_index" \
            --slurpfile tags "$tag_index" '
              {
                sha: $sha,
                main_sha: $main_sha,
                sha_reachable_from_main: $sha_reachable,
                year: $year,
                repository: $repository,
                build_timestamp: $build_timestamp,
                releases: $releases[0],
                tags: $tags[0]
              }
            ' > "$selection_input"
          python3 .github/scripts/release-contract.py select-version \
            --input "$selection_input" \
            --output "$selection"

          tag=$(jq -er '.tag' "$selection")
          prev_tag=$(jq -er '.prev_tag' "$selection")
          build_timestamp=$(jq -er '.build_timestamp' "$selection")
          image=$(jq -er '.image' "$selection")
          already_published=$(jq -r '.already_published' "$selection")
          [[ "$already_published" == true || "$already_published" == false ]] || {
            echo "release helper returned a malformed already_published value" >&2
            exit 1
          }
          {
            echo "tag=$tag"
            echo "prev_tag=$prev_tag"
            echo "sha=$sha"
            echo "build_timestamp=$build_timestamp"
            echo "image=$image"
            echo "already_published=$already_published"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: $tag ($sha); previous: ${prev_tag:-<none>}; already published: $already_published"

  build-unix:
    name: Build ${{ matrix.platform }} ${{ matrix.architecture }}
    needs: version
    if: needs.version.outputs.already_published != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            architecture: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            architecture: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            architecture: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build native release binary
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Build unwind-safe C SDK shared library
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
        run: >-
          cargo build -p synology-drive-sync-ffi --profile ffi-release --locked
          --target "${{ matrix.target }}"
      - name: Compile, link and load the C SDK example
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          library_dir="target/$TARGET/ffi-release"
          smoke="$RUNNER_TEMP/sdsync-c-sdk-smoke"
          cc \
            -std=c11 \
            -Wall -Wextra -Wpedantic -Werror \
            -I include \
            examples/ffi/basic.c \
            -L "$library_dir" \
            -lsdsync \
            -o "$smoke"
          smoke_status=0
          if [[ "$PLATFORM" == linux ]]; then
            LD_LIBRARY_PATH="$library_dir" "$smoke" \
              > "$RUNNER_TEMP/sdsync-c-smoke.stdout" \
              2> "$RUNNER_TEMP/sdsync-c-smoke.stderr" || smoke_status=$?
          else
            DYLD_LIBRARY_PATH="$library_dir" "$smoke" \
              > "$RUNNER_TEMP/sdsync-c-smoke.stdout" \
              2> "$RUNNER_TEMP/sdsync-c-smoke.stderr" || smoke_status=$?
          fi
          [[ "$smoke_status" -eq 2 ]] || {
            echo "C SDK example no-argument probe exited $smoke_status, expected 2" >&2
            cat "$RUNNER_TEMP/sdsync-c-smoke.stderr" >&2
            exit 1
          }
          grep -F 'usage:' "$RUNNER_TEMP/sdsync-c-smoke.stderr" >/dev/null
          grep -F 'REQUEST.json' "$RUNNER_TEMP/sdsync-c-smoke.stderr" >/dev/null
      - name: Verify Linux ABI baseline
        if: matrix.platform == 'linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifacts=(
            "target/$TARGET/release/synology-drive-sync"
            "target/$TARGET/ffi-release/libsdsync.so"
          )
          for artifact in "${artifacts[@]}"; do
            glibc_file="$RUNNER_TEMP/$(basename -- "$artifact").glibc-versions.txt"
            if ! readelf --version-info --wide "$artifact" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' \
              | LC_ALL=C sort -Vu > "$glibc_file"; then
              echo "could not read GLIBC version requirements from $artifact" >&2
              exit 1
            fi
            mapfile -t glibc_versions < "$glibc_file"
            [[ "${#glibc_versions[@]}" -gt 0 ]] || {
              echo "$artifact declares no GLIBC symbol versions; refusing to ship an unverifiable ABI" >&2
              exit 1
            }
            max_glibc="${glibc_versions[${#glibc_versions[@]} - 1]#GLIBC_}"
            if [[ "$(printf '%s\n' "$max_glibc" '2.35' | LC_ALL=C sort -V | tail -n 1)" != '2.35' ]]; then
              echo "$artifact requires GLIBC_$max_glibc; release ceiling is GLIBC_2.35" >&2
              exit 1
            fi

            needed=$(readelf --dynamic --wide "$artifact" | awk '/NEEDED/ { gsub(/[\[\]]/, "", $NF); print $NF }')
            printf '%s maximum GLIBC version: GLIBC_%s\nDynamic dependencies:\n%s\n' \
              "$artifact" "$max_glibc" "$needed"
            if grep -Eq '^(libsecret|libdbus|libssl|libcrypto)' <<<"$needed"; then
              echo "$artifact unexpectedly links a forbidden native vault or TLS library" >&2
              exit 1
            fi
          done
      - name: Assemble archive
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          archive_root="synology-drive-sync-$TAG-$PLATFORM-$ARCHITECTURE"
          package_root="package/$archive_root"
          binary="target/$TARGET/release/synology-drive-sync"
          mkdir -p "$package_root/completions" "$package_root/man"
          install -m 0755 "$binary" "$package_root/synology-drive-sync"
          install -m 0644 LICENSE README.md SECURITY.md THIRD_PARTY_LICENSES.html "$package_root/"
          "$binary" completions bash > "$package_root/completions/synology-drive-sync.bash"
          "$binary" completions zsh > "$package_root/completions/_synology-drive-sync"
          "$binary" completions fish > "$package_root/completions/synology-drive-sync.fish"
          "$binary" completions powershell > "$package_root/completions/synology-drive-sync.ps1"
          "$binary" completions elvish > "$package_root/completions/synology-drive-sync.elv"
          if ! "$binary" manpage --all "$package_root/man"; then
            echo 'recursive manpage generation failed' >&2
            exit 1
          fi
          reported=$("$binary" --version)
          expected="synology-drive-sync $TAG"
          [[ "$reported" == "$expected" ]] || {
            echo "binary version did not exactly match $expected: $reported" >&2
            exit 1
          }
          tar -czf "$archive_root.tar.gz" -C package "$archive_root"
      - name: Assemble C SDK archive
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          sdk_root="synology-drive-sync-$TAG-c-sdk-$PLATFORM-$ARCHITECTURE"
          sdk_package="package/$sdk_root"
          mkdir -p "$sdk_package/include" "$sdk_package/lib" "$sdk_package/examples/ffi"
          install -m 0644 include/sdsync.h "$sdk_package/include/sdsync.h"
          install -m 0644 examples/ffi/basic.c "$sdk_package/examples/ffi/basic.c"
          install -m 0644 LICENSE THIRD_PARTY_LICENSES.html "$sdk_package/"
          case "$PLATFORM" in
            linux) library="target/$TARGET/ffi-release/libsdsync.so" ;;
            macos) library="target/$TARGET/ffi-release/libsdsync.dylib" ;;
            *) echo "unsupported C SDK platform: $PLATFORM" >&2; exit 1 ;;
          esac
          description=$(file -b "$library")
          case "$PLATFORM/$ARCHITECTURE" in
            linux/x86_64) expected_machine='Advanced Micro Devices X86-64' ;;
            linux/aarch64) expected_machine='AArch64' ;;
            macos/x86_64)
              [[ "$description" == *'Mach-O 64-bit dynamically linked shared library x86_64'* ]] || {
                echo "unexpected macOS x86_64 library kind: $description" >&2
                exit 1
              }
              ;;
            macos/aarch64)
              [[ "$description" == *'Mach-O 64-bit dynamically linked shared library arm64'* ]] || {
                echo "unexpected macOS arm64 library kind: $description" >&2
                exit 1
              }
              ;;
            *) echo "unsupported C SDK architecture: $PLATFORM/$ARCHITECTURE" >&2; exit 1 ;;
          esac
          if [[ "$PLATFORM" == linux ]]; then
            [[ "$description" == *'ELF 64-bit LSB shared object'* ]] || {
              echo "unexpected Linux shared-library kind: $description" >&2
              exit 1
            }
            elf_type=$(readelf --file-header --wide "$library" | awk -F: '/Type:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
            elf_machine=$(readelf --file-header --wide "$library" | awk -F: '/Machine:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
            [[ "$elf_type" == DYN* ]] || {
              echo "Linux C SDK output is not a shared object: $elf_type" >&2
              exit 1
            }
            [[ "$elf_machine" == "$expected_machine" ]] || {
              echo "Linux C SDK machine is $elf_machine, expected $expected_machine" >&2
              exit 1
            }
          fi
          install -m 0755 "$library" "$sdk_package/lib/$(basename -- "$library")"
          tar -czf "$sdk_root.tar.gz" -C package "$sdk_root"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            synology-drive-sync-${{ needs.version.outputs.tag }}-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
            synology-drive-sync-${{ needs.version.outputs.tag }}-c-sdk-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build windows ${{ matrix.architecture }}
    needs: version
    if: needs.version.outputs.already_published != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            architecture: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Build native release binary
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Build unwind-safe C SDK shared library
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
        run: >-
          cargo build -p synology-drive-sync-ffi --profile ffi-release --locked
          --target "${{ matrix.target }}"
      - name: Compile, link and load the C SDK example
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installationPath = @(& $vswhere -latest -products * -property installationPath)[0]
          if (-not $installationPath) { throw 'Visual Studio installation was not found' }
          $devCmd = Join-Path $installationPath 'Common7/Tools/VsDevCmd.bat'
          $vcArch = switch ($env:ARCHITECTURE) {
            'x86_64' { 'x64' }
            'aarch64' { 'arm64' }
            default { throw "unsupported Windows C SDK architecture $env:ARCHITECTURE" }
          }
          $devCommand = "`"$devCmd`" -no_logo -arch=$vcArch -host_arch=$vcArch >nul && set"
          $environmentLines = @(& $env:ComSpec /d /s /c $devCommand)
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio developer environment setup failed' }
          foreach ($line in $environmentLines) {
            $separator = $line.IndexOf('=')
            if ($separator -gt 0) {
              [Environment]::SetEnvironmentVariable(
                $line.Substring(0, $separator),
                $line.Substring($separator + 1),
                'Process')
            }
          }
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC compiler is unavailable for $vcArch"
          }
          $libraryRoot = "target/$env:TARGET/ffi-release"
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'sdsync-c-sdk-smoke'
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          $smokeExe = Join-Path $smokeRoot 'sdsync-c-sdk-smoke.exe'
          $objectFile = Join-Path $smokeRoot 'basic.obj'
          $importLibrary = Join-Path $libraryRoot 'sdsync.dll.lib'
          $compileArgs = @(
            '/nologo'
            '/std:c11'
            '/W4'
            '/WX'
            '/D_CRT_SECURE_NO_WARNINGS'
            '/Iinclude'
            'examples/ffi/basic.c'
            $importLibrary
            "/Fo$objectFile"
            "/Fe$smokeExe"
          )
          & cl.exe @compileArgs
          if ($LASTEXITCODE -ne 0) { throw 'strict C SDK example compilation failed' }
          Copy-Item -LiteralPath (Join-Path $libraryRoot 'sdsync.dll') -Destination $smokeRoot
          $usageOutput = @(& $smokeExe 2>&1)
          $usageStatus = $LASTEXITCODE
          if ($usageStatus -ne 2) {
            throw "C SDK example no-argument probe exited $usageStatus, expected 2: $($usageOutput -join [Environment]::NewLine)"
          }
          $renderedUsage = $usageOutput -join [Environment]::NewLine
          if (-not $renderedUsage.Contains('usage:') -or
              -not $renderedUsage.Contains('REQUEST.json')) {
            throw "C SDK example did not render its usage contract: $renderedUsage"
          }
          $global:LASTEXITCODE = 0
      - name: Assemble archive
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "synology-drive-sync-$env:TAG-windows-$env:ARCHITECTURE"
          $packageRoot = Join-Path 'package' $root
          $completionRoot = Join-Path $packageRoot 'completions'
          $manRoot = Join-Path $packageRoot 'man'
          New-Item -ItemType Directory -Path $completionRoot, $manRoot | Out-Null
          $binary = Join-Path "target/$env:TARGET/release" 'synology-drive-sync.exe'
          Copy-Item -LiteralPath $binary -Destination $packageRoot
          Copy-Item -LiteralPath LICENSE, README.md, SECURITY.md, THIRD_PARTY_LICENSES.html -Destination $packageRoot
          & $binary completions bash | Out-File (Join-Path $completionRoot 'synology-drive-sync.bash') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'bash completion generation failed' }
          & $binary completions zsh | Out-File (Join-Path $completionRoot '_synology-drive-sync') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'zsh completion generation failed' }
          & $binary completions fish | Out-File (Join-Path $completionRoot 'synology-drive-sync.fish') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'fish completion generation failed' }
          & $binary completions powershell | Out-File (Join-Path $completionRoot 'synology-drive-sync.ps1') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell completion generation failed' }
          & $binary completions elvish | Out-File (Join-Path $completionRoot 'synology-drive-sync.elv') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Elvish completion generation failed' }
          & $binary manpage --all $manRoot
          if ($LASTEXITCODE -ne 0) { throw 'recursive manpage generation failed' }
          $reportedLines = @(& $binary --version)
          $versionExitCode = $LASTEXITCODE
          $expected = "synology-drive-sync $env:TAG"
          if ($versionExitCode -ne 0 -or
              $reportedLines.Count -ne 1 -or
              ([string] $reportedLines[0]) -cne $expected) {
            $reported = $reportedLines -join "`n"
            throw "binary version did not exactly match ${expected}: $reported"
          }
          Compress-Archive -Path $packageRoot -DestinationPath "$root.zip"
      - name: Assemble C SDK archive
        shell: pwsh
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkRoot = "synology-drive-sync-$env:TAG-c-sdk-windows-$env:ARCHITECTURE"
          $sdkPackage = Join-Path 'package' $sdkRoot
          $includeRoot = Join-Path $sdkPackage 'include'
          $libraryRoot = Join-Path $sdkPackage 'lib'
          $exampleRoot = Join-Path $sdkPackage 'examples/ffi'
          New-Item -ItemType Directory -Path $includeRoot, $libraryRoot, $exampleRoot | Out-Null
          Copy-Item -LiteralPath include/sdsync.h -Destination (Join-Path $includeRoot 'sdsync.h')
          Copy-Item -LiteralPath examples/ffi/basic.c -Destination (Join-Path $exampleRoot 'basic.c')
          Copy-Item -LiteralPath LICENSE, THIRD_PARTY_LICENSES.html -Destination $sdkPackage
          $targetRoot = "target/$env:TARGET/ffi-release"
          $dll = Join-Path $targetRoot 'sdsync.dll'
          $dllBytes = [IO.File]::ReadAllBytes($dll)
          if ($dllBytes.Length -lt 64 -or $dllBytes[0] -ne 0x4d -or $dllBytes[1] -ne 0x5a) {
            throw "$dll is not a valid PE image"
          }
          $peOffset = [BitConverter]::ToInt32($dllBytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 24 -gt $dllBytes.Length -or
              [Text.Encoding]::ASCII.GetString($dllBytes, $peOffset, 4) -cne "PE`0`0") {
            throw "$dll has an invalid PE header"
          }
          $machine = [BitConverter]::ToUInt16($dllBytes, $peOffset + 4)
          $expectedMachine = switch ($env:ARCHITECTURE) {
            'x86_64' { 0x8664 }
            'aarch64' { 0xaa64 }
            default { throw "unsupported Windows C SDK architecture $env:ARCHITECTURE" }
          }
          if ($machine -ne $expectedMachine) {
            throw ('{0} PE machine is 0x{1:x4}, expected 0x{2:x4}' -f $dll, $machine, $expectedMachine)
          }
          $characteristics = [BitConverter]::ToUInt16($dllBytes, $peOffset + 22)
          if (($characteristics -band 0x2000) -eq 0) {
            throw "$dll is not marked as a DLL"
          }
          Copy-Item -LiteralPath $dll -Destination $libraryRoot
          $generatedImportLibrary = Join-Path $targetRoot 'sdsync.dll.lib'
          if (-not (Test-Path -LiteralPath $generatedImportLibrary -PathType Leaf)) {
            throw "MSVC did not generate expected import library $generatedImportLibrary"
          }
          Copy-Item -LiteralPath $generatedImportLibrary -Destination (Join-Path $libraryRoot 'sdsync.lib')
          Compress-Archive -Path $sdkPackage -DestinationPath "$sdkRoot.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows-${{ matrix.architecture }}
          path: |
            synology-drive-sync-${{ needs.version.outputs.tag }}-windows-${{ matrix.architecture }}.zip
            synology-drive-sync-${{ needs.version.outputs.tag }}-c-sdk-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error
          retention-days: 7

  build-synology:
    name: Build Synology DSM ${{ matrix.synology_arch }}
    needs: version
    if: needs.version.outputs.already_published != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            synology_arch: x86_64
            elf_class: ELF64
            elf_machine: Advanced Micro Devices X86-64
            cross_compile: false
            qemu_binary: ""
            qemu_cpu: ""
            arm_hard_float: false
          - runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            synology_arch: armv8
            elf_class: ELF64
            elf_machine: AArch64
            cross_compile: false
            qemu_binary: ""
            qemu_cpu: ""
            arm_hard_float: false
          - runner: ubuntu-24.04
            rust_target: i686-unknown-linux-musl
            synology_arch: i686
            elf_class: ELF32
            elf_machine: Intel 80386
            cross_compile: true
            qemu_binary: qemu-i386
            qemu_cpu: qemu32
            arm_hard_float: false
          - runner: ubuntu-24.04
            rust_target: armv7-unknown-linux-musleabihf
            synology_arch: armv7
            elf_class: ELF32
            elf_machine: ARM
            cross_compile: true
            qemu_binary: qemu-arm
            qemu_cpu: cortex-a9,neon=off,vfp-d32=off
            arm_hard_float: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: packaging/synology/ui-src/package.json
      - name: Build native DSM AppWindow assets
        working-directory: packaging/synology/ui-src
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run build
          git diff --exit-code -- dist
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}
      - name: Install pinned Zig cross-linker
        if: matrix.cross_compile == true
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install pinned cargo-zigbuild
        if: matrix.cross_compile == true
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-zigbuild@0.23.2
      - name: Extract pinned QEMU user emulator
        if: matrix.cross_compile == true
        env:
          QEMU_BINARY: ${{ matrix.qemu_binary }}
          QEMU_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
        run: |
          set -euo pipefail
          container=$(docker create "$QEMU_IMAGE")
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker cp "$container:/usr/bin/$QEMU_BINARY" "$RUNNER_TEMP/$QEMU_BINARY"
          chmod 0755 "$RUNNER_TEMP/$QEMU_BINARY"
          "$RUNNER_TEMP/$QEMU_BINARY" --version
      - name: Install native musl toolchain
        if: matrix.cross_compile != true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools
      - name: Build native DSM-portable static binary
        if: matrix.cross_compile != true
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
          RUST_TARGET: ${{ matrix.rust_target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: >-
          cargo build --release --locked
          --package synology-drive-sync
          --bin synology-drive-sync --bin sdsync-dsm-api
          --target "$RUST_TARGET"
      - name: Cross-build DSM-portable static binary
        if: matrix.cross_compile == true
        env:
          SDSYNC_BUILD_VERSION: ${{ needs.version.outputs.tag }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: >-
          cargo zigbuild --release --locked
          --package synology-drive-sync
          --bin synology-drive-sync --bin sdsync-dsm-api
          --target "$RUST_TARGET"
      - name: Verify DSM binaries, architecture and static linkage
        shell: bash
        env:
          ARM_HARD_FLOAT: ${{ matrix.arm_hard_float }}
          ELF_CLASS: ${{ matrix.elf_class }}
          ELF_MACHINE: ${{ matrix.elf_machine }}
          QEMU_BINARY: ${{ matrix.qemu_binary }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
          RUST_TARGET: ${{ matrix.rust_target }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/synology-drive-sync"
          api_binary="target/$RUST_TARGET/release/sdsync-dsm-api"
          for checked_binary in "$binary" "$api_binary"; do
            label=$(basename "$checked_binary")
            class=$(readelf --file-header --wide "$checked_binary" | awk -F: '/Class:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
            [[ "$class" == "$ELF_CLASS" ]] || {
              echo "$label has unexpected ELF class: $class (expected $ELF_CLASS)" >&2
              exit 1
            }
            machine=$(readelf --file-header --wide "$checked_binary" | awk -F: '/Machine:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
            [[ "$machine" == "$ELF_MACHINE" ]] || {
              echo "$label has unexpected ELF machine: $machine (expected $ELF_MACHINE)" >&2
              exit 1
            }
            if readelf --program-headers --wide "$checked_binary" | grep -q 'INTERP'; then
              echo "$label must not require a host ELF interpreter" >&2
              exit 1
            fi
            if readelf --dynamic --wide "$checked_binary" 2>/dev/null | grep -q 'NEEDED'; then
              echo "$label must not require host dynamic libraries" >&2
              exit 1
            fi
            if [[ "$ARM_HARD_FLOAT" == true ]]; then
              flags=$(readelf --file-header --wide "$checked_binary" | awk -F: '/Flags:/ { sub(/^[[:space:]]+/, "", $2); print $2 }')
              [[ "$flags" == *'Version5 EABI'* && "$flags" == *'hard-float ABI'* ]] || {
                echo "$label does not declare EABI5 hard-float: $flags" >&2
                exit 1
              }
            fi
          done
          if [[ -n "$QEMU_BINARY" ]]; then
            emulator="$RUNNER_TEMP/$QEMU_BINARY"
            [[ -x "$emulator" ]] || {
              echo "pinned QEMU emulator is missing: $emulator" >&2
              exit 1
            }
            # This extracted tonistiigi binfmt QEMU treats the first post-binary
            # guest argument as argv[0], so supply it before the real arguments.
            reported=$(QEMU_CPU="$QEMU_CPU" "$emulator" "$binary" synology-drive-sync --version)
            set +e
            bridge_output=$(REQUEST_METHOD=GET QEMU_CPU="$QEMU_CPU" "$emulator" "$api_binary" sdsync-dsm-api 2>&1)
            bridge_exit=$?
            set -e
          else
            reported=$("$binary" --version)
            set +e
            bridge_output=$(REQUEST_METHOD=GET "$api_binary" 2>&1)
            bridge_exit=$?
            set -e
          fi
          expected="synology-drive-sync $TAG"
          [[ "$reported" == "$expected" ]] || {
            echo "DSM binary version did not exactly match $expected: $reported" >&2
            exit 1
          }
          [[ "$bridge_exit" -ne 0 ]]
          grep -Fq 'Status: 400 Bad Request' <<<"$bridge_output"
          grep -Fq 'Content-Type: application/json; charset=utf-8' <<<"$bridge_output"
          grep -Fq '"schema":"sdsync.dsm-error.v1"' <<<"$bridge_output"
      - name: Assemble and validate installable SPK
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          SYNOLOGY_ARCH: ${{ matrix.synology_arch }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          binary="target/$RUST_TARGET/release/synology-drive-sync"
          api_binary="target/$RUST_TARGET/release/sdsync-dsm-api"
          bash packaging/synology/build-spk.sh \
            --binary "$binary" \
            --api-binary "$api_binary" \
            --arch "$SYNOLOGY_ARCH" \
            --version "$TAG" \
            --output dist
          spk="dist/synology-drive-sync-$TAG-$SYNOLOGY_ARCH.spk"
          python3 packaging/synology/validate_spk.py \
            --binary "$binary" \
            --api-binary "$api_binary" \
            --arch "$SYNOLOGY_ARCH" \
            "$spk"
      - name: Exercise real DSM supervisor lifecycle under BusyBox
        if: matrix.synology_arch == 'x86_64'
        shell: bash
        env:
          ALPINE_IMAGE: docker.io/library/alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          TAG: ${{ needs.version.outputs.tag }}
        run: >-
          docker run --rm --network none --platform linux/amd64
          --volume "$PWD:/workspace:ro"
          "$ALPINE_IMAGE"
          /bin/sh /workspace/packaging/synology/test_real_supervisor.sh
          "/workspace/dist/synology-drive-sync-$TAG-x86_64.spk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-synology-${{ matrix.synology_arch }}
          path: dist/synology-drive-sync-${{ needs.version.outputs.tag }}-${{ matrix.synology_arch }}.spk
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: Dependency SBOM
    needs: version
    if: needs.version.outputs.already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-07-16)
        with:
          toolchain: 1.88.0
      - name: Validate the Rust SDK package
        run: cargo package -p synology-drive-sync --locked
      - name: Generate CycloneDX JSON
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          BUILD_TIMESTAMP: ${{ needs.version.outputs.build_timestamp }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]{2}\.[1-9][0-9]*$ ]] || {
            echo "refusing to build an SBOM for a malformed calendar tag: $TAG" >&2
            exit 1
          }
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "unexpected repository slug: $REPOSITORY" >&2
            exit 1
          }
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx -f json --spec-version 1.5 --all-features --target all
          root_source_sbom="synology-drive-sync.cdx.json"
          ffi_source_sbom="crates/synology-drive-sync-ffi/synology-drive-sync-ffi.cdx.json"
          [[ -f "$root_source_sbom" && -f "$ffi_source_sbom" ]] || {
            echo 'cargo-cyclonedx did not produce both exact workspace-member SBOMs' >&2
            exit 1
          }
          jq -e '
            .metadata.component.name == "synology-drive-sync"
          ' "$root_source_sbom" >/dev/null || {
            echo 'root workspace-member SBOM has an unexpected component' >&2
            exit 1
          }
          jq -e '
            .metadata.component.name == "synology-drive-sync-ffi"
            and any(.components[]?; .name == "synology-drive-sync")
          ' "$ffi_source_sbom" >/dev/null || {
            echo 'FFI workspace-member SBOM does not include both FFI and root packages' >&2
            exit 1
          }

          cyclonedx_cli="$RUNNER_TEMP/cyclonedx"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64" \
            --output "$cyclonedx_cli"
          printf '%s  %s\n' \
            'bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746' \
            "$cyclonedx_cli" | sha256sum --check --status || {
              echo 'CycloneDX CLI v0.33.1 checksum verification failed' >&2
              exit 1
            }
          chmod 0755 "$cyclonedx_cli"

          merged="$RUNNER_TEMP/sdsync-workspace.cdx.json"
          "$cyclonedx_cli" merge \
            --input-files "$root_source_sbom" "$ffi_source_sbom" \
            --hierarchical \
            --group supermarsx \
            --name synology-drive-sync \
            --version "$TAG" \
            --output-format json \
            --output-version v1_5 \
            --output-file "$merged"
          aggregate_ref=$(jq -er '.metadata.component["bom-ref"] | select(type == "string" and length > 0)' "$merged")
          root_purl="pkg:github/$REPOSITORY@$TAG"
          # The hierarchical merge retains both workspace-member identities.
          # Normalize only the aggregate release identity, serial and timestamp
          # so the published SBOM remains byte-reproducible and attestable.
          serial="urn:uuid:$(
            python3 -c 'import sys, uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, sys.argv[1]))' \
              "https://github.com/$REPOSITORY/releases/tag/$TAG"
          )"
          [[ "$serial" =~ ^urn:uuid:[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]] || {
            echo "derived SBOM serial number is malformed: $serial" >&2
            exit 1
          }
          normalized=$(mktemp)
          trap 'rm -f -- "$normalized"' EXIT
          jq \
            --arg tag "$TAG" \
            --arg aggregate_ref "$aggregate_ref" \
            --arg build_timestamp "$BUILD_TIMESTAMP" \
            --arg root_purl "$root_purl" \
            --arg serial "$serial" '
              walk(if type == "string" and . == $aggregate_ref then $root_purl else . end)
              | .serialNumber = $serial
              | .metadata.timestamp = $build_timestamp
              | .metadata.component.type = "application"
              | .metadata.component.group = "supermarsx"
              | .metadata.component.name = "synology-drive-sync"
              | .metadata.component.version = $tag
              | .metadata.component.purl = $root_purl
              | .metadata.component["bom-ref"] = $root_purl
            ' "$merged" > "$normalized"
          mv "$normalized" "synology-drive-sync-$TAG.cdx.json"
          jq -e \
            --arg tag "$TAG" \
            --arg build_timestamp "$BUILD_TIMESTAMP" \
            --arg root_purl "$root_purl" \
            --arg serial "$serial" '
              ([.metadata.component, .components[]?]
                | [.[] | recurse(.components[]?)]) as $components
              | ($components | map(.["bom-ref"])) as $refs
              | ($refs | unique) as $component_refs
              |
              .bomFormat == "CycloneDX"
              and .serialNumber == $serial
              and .specVersion == "1.5"
              and .metadata.timestamp == $build_timestamp
              and ((.components | type) == "array")
              and .metadata.component.type == "application"
              and .metadata.component.group == "supermarsx"
              and .metadata.component.name == "synology-drive-sync"
              and .metadata.component.version == $tag
              and .metadata.component.purl == $root_purl
              and .metadata.component["bom-ref"] == $root_purl
              and any($components[]; .name == "synology-drive-sync-ffi")
              and any($components[];
                .name == "synology-drive-sync" and .["bom-ref"] != $root_purl)
              and all($refs[]; type == "string" and length > 0)
              and ($refs | length) == ($component_refs | length)
              and any(.dependencies[]; .ref == $root_purl)
              and all(.dependencies[]?;
                (.ref as $ref | $component_refs | index($ref)) != null
                and all(.dependsOn[]?;
                  . as $ref | ($component_refs | index($ref)) != null))
            ' "synology-drive-sync-$TAG.cdx.json" >/dev/null
          "$cyclonedx_cli" validate \
            --input-file "synology-drive-sync-$TAG.cdx.json" \
            --input-format json \
            --input-version v1_5 \
            --fail-on-errors
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-sbom
          path: synology-drive-sync-${{ needs.version.outputs.tag }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  image:
    name: Build image ${{ matrix.architecture }}
    needs: version
    if: needs.version.outputs.already_published != 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - name: Log in to GHCR
        # MUTATION GUARD: a dry run builds locally and never touches a registry,
        # so it needs no credentials at all.
        if: needs.version.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Create native BuildKit builder
        shell: bash
        run: |
          docker buildx create --name release-builder --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Build and verify architecture image
        shell: bash
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          CREATED: ${{ needs.version.outputs.build_timestamp }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
          DRY_RUN: ${{ needs.version.outputs.dry_run }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/sdsync-image-metadata.json"

          # Audit H1/M1: this used to push $IMAGE:$TAG-$ARCH, leaving a permanent
          # public per-architecture tag behind on any later failure and never
          # removing it after the manifest was assembled. Push by digest with no
          # tag instead: an abandoned run leaves only untagged blobs, which GHCR
          # garbage-collects, and nothing is publicly addressable until
          # publish-image assembles the manifest.
          build_args=(
            buildx build
            --platform "$PLATFORM"
            --build-arg "VERSION=$TAG"
            --build-arg "VCS_REF=$SHA"
            --build-arg "BUILD_DATE=$CREATED"
            --label "org.opencontainers.image.created=$CREATED"
            --label "org.opencontainers.image.revision=$SHA"
            --label "org.opencontainers.image.version=$TAG"
          )

          if [[ "$DRY_RUN" == "true" ]]; then
            # MUTATION GUARD: no --push and no registry output. The docker
            # exporter cannot carry attestations, so provenance and SBOM
            # generation are disabled on this path only -- every other build
            # argument is identical to the published path below, so the rehearsal
            # still exercises the real Dockerfile and the real version check.
            build_args+=(
              --provenance=false
              --sbom=false
              --tag "sdsync-dry-run:$ARCHITECTURE"
              --load
            )
            docker "${build_args[@]}" .
            image_ref="sdsync-dry-run:$ARCHITECTURE"
          else
            build_args+=(
              --provenance=mode=max
              --sbom=true
              --metadata-file "$metadata"
              --output "type=image,name=$IMAGE,name-canonical=true,push-by-digest=true,push=true"
            )
            docker "${build_args[@]}" .
            digest=$(jq -r '."containerimage.digest" // empty' "$metadata")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "buildx did not report a usable image digest: '${digest:-<empty>}'" >&2
              exit 1
            }
            printf '%s\n' "$digest" > "image-digest-$ARCHITECTURE.txt"
            image_ref="$IMAGE@$digest"
          fi

          reported=$(docker run --rm "$image_ref" --version)
          expected="synology-drive-sync $TAG"
          [[ "$reported" == "$expected" ]] || {
            echo "image binary version did not exactly match $expected: $reported" >&2
            exit 1
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.dry_run != 'true'
        with:
          # Matrix legs share one `outputs:` block and would clobber each other,
          # so each architecture hands its digest to publish-image as a
          # distinctly named artifact.
          name: image-digest-${{ matrix.architecture }}
          path: image-digest-${{ matrix.architecture }}.txt
          if-no-files-found: error
          retention-days: 7

  stage-release:
    name: Stage GitHub Release draft
    needs: [version, build-unix, build-windows, build-synology, sbom, image]
    if: needs.version.outputs.already_published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - id: release_state
        name: Resolve release state
        # Audit H3: this guard used to live BELOW the three attest steps, so a
        # run that was going to be refused for touching an already-published
        # release had already minted permanent, unretractable attestations for a
        # rebuilt artifact set. The check now runs first and fails closed.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          # Drafts cannot be resolved by the tag endpoint. List every release,
          # then let the tested helper reject duplicates, stale targets,
          # conflicting tags and already-published immutable state.
          release_pages="$RUNNER_TEMP/sdsync-stage-release-pages.json"
          release_index="$RUNNER_TEMP/sdsync-stage-release-index.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$release_pages"
          jq -s 'add // []' "$release_pages" > "$release_index"

          tag_sha_json=null
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tag_sha_json=$(git rev-list -n 1 "$TAG" | jq -R .)
          fi
          state_input="$RUNNER_TEMP/sdsync-stage-state-input.json"
          state="$RUNNER_TEMP/sdsync-stage-state.json"
          jq -n \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson tag_sha "$tag_sha_json" \
            --slurpfile releases "$release_index" '
              {
                tag: $tag,
                sha: $sha,
                repository: $repository,
                tag_sha: $tag_sha,
                releases: $releases[0]
              }
            ' > "$state_input"
          python3 .github/scripts/release-contract.py resolve-state \
            --input "$state_input" \
            --output "$state"
          release_id=$(jq -r '.release_id // ""' "$state")
          tag_matches=$(jq -r '.tag_matches' "$state")
          [[ "$tag_matches" == true || "$tag_matches" == false ]] || {
            echo "release helper returned a malformed tag_matches value" >&2
            exit 1
          }
          {
            echo "release_id=$release_id"
            echo "tag_matches=$tag_matches"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "$release_id" ]]; then
            echo "resuming draft release $TAG (id $release_id)"
          else
            echo "no release carries tag $TAG yet; a draft will be created"
          fi
      - name: Prepare checksums and installer assets
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SHA" ]] || {
            echo "checkout does not match approved release SHA $SHA" >&2
            exit 1
          }
          rust_sdk="synology-drive-sync-$TAG-rust-sdk.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="synology-drive-sync-$TAG-rust-sdk/" \
            -o "dist/$rust_sdk" \
            "$SHA"
          install -m 0755 packaging/install.sh dist/install.sh
          install -m 0644 packaging/install.ps1 dist/install.ps1
          install -m 0644 THIRD_PARTY_LICENSES.html dist/THIRD_PARTY_LICENSES.html
          for synology_arch in armv7 armv8 i686 x86_64; do
            python3 packaging/synology/validate_spk.py \
              --arch "$synology_arch" \
              "dist/synology-drive-sync-$TAG-$synology_arch.spk"
          done
          python3 .github/scripts/release-contract.py verify-sdk-archives \
            --directory dist \
            --tag "$TAG"
          python3 .github/scripts/release-contract.py prepare-assets \
            --directory dist \
            --tag "$TAG"
          python3 .github/scripts/release-contract.py verify-assets \
            --directory dist \
            --tag "$TAG" \
            --include-archive-manifest
      - name: Render release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          PREV_TAG: ${{ needs.version.outputs.prev_tag }}
          SHA: ${{ needs.version.outputs.sha }}
          DRY_RUN: ${{ needs.version.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/sdsync-release-notes.md"
          bash .github/scripts/render-release-notes.sh \
            "$PREV_TAG" "$SHA" "$TAG" "$notes"
          {
            if [[ "$DRY_RUN" == "true" ]]; then
              printf '# DRY RUN -- nothing below has been published\n\n'
            fi
            printf '# Release notes preview: %s\n\n' "$TAG"
            cat -- "$notes"
          } >> "$GITHUB_STEP_SUMMARY"
          printf 'Rendered release notes for %s (previous tag: %s)\n' \
            "$TAG" "${PREV_TAG:-<none>}"
      - name: Attest release provenance
        # MUTATION GUARD: attestations are permanent and publicly verifiable and
        # this workflow cannot un-mint them. A dry run must never create one.
        if: needs.version.outputs.dry_run != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Attest dependency SBOM
        # MUTATION GUARD: see above.
        if: needs.version.outputs.dry_run != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/ARCHIVE_SHA256SUMS
          sbom-path: dist/synology-drive-sync-${{ needs.version.outputs.tag }}.cdx.json
      - name: Attest checksum manifest
        # MUTATION GUARD: see above.
        if: needs.version.outputs.dry_run != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/SHA256SUMS
      - id: assets
        name: Verify the release asset set
        env:
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # ARCHIVE_SHA256SUMS exists only as an attestation subject list and is
          # never a release asset.
          rm dist/ARCHIVE_SHA256SUMS
          python3 .github/scripts/release-contract.py verify-assets \
            --directory dist \
            --tag "$TAG"
          asset_list="$RUNNER_TEMP/sdsync-assets.bin"
          find dist -maxdepth 1 -type f -print0 | LC_ALL=C sort -z > "$asset_list"
          mapfile -d '' -t assets < "$asset_list"
          python3 .github/scripts/release-contract.py asset-index \
            --directory dist \
            --tag "$TAG" \
            --output "$RUNNER_TEMP/sdsync-local-asset-index.json"
          printf '%s\n' "${assets[@]}"
      - id: draft
        name: Create or resume the draft release
        # MUTATION GUARD: creates the draft release. A draft does not create a
        # git tag, but it does consume a calendar number.
        if: needs.version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          RELEASE_ID: ${{ steps.release_state.outputs.release_id }}
          TAG_MATCHES: ${{ steps.release_state.outputs.tag_matches }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/sdsync-release-notes.md"
          payload="$RUNNER_TEMP/sdsync-draft-payload.json"
          updated="$RUNNER_TEMP/sdsync-updated-draft.json"
          release_id="$RELEASE_ID"
          python3 .github/scripts/release-contract.py draft-payload \
            --tag "$TAG" \
            --sha "$SHA" \
            --notes "$notes" \
            --output "$payload"

          if [[ -z "$release_id" ]]; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              --input "$payload" > "$updated"
            release_id=$(jq -er '.id | select(type == "number" and . > 0)' "$updated")
          else
            # A resumed draft may have been left by an older failed run or
            # deliberately retargeted during recovery. Refresh every mutable
            # identity field and the freshly rendered notes by immutable id so
            # publication can never ship stale release metadata.
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --input "$payload" > "$updated"
          fi

          jq -e \
            --argjson id "$release_id" \
            --argjson tag_matches "$TAG_MATCHES" \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            --arg title "synology-drive-sync $TAG" '
              .id == $id
              and .draft == true
              and .prerelease == false
              and .tag_name == $tag
              and ($tag_matches or .target_commitish == $sha)
              and .name == $title
            ' "$updated" >/dev/null
          # Compare body strings inside jq. Materialising `.body` with `jq -r`
          # appends a record terminator and used to double a terminal LF.
          jq -e --rawfile notes "$notes" '.body == $notes' "$updated" >/dev/null

          # Re-list after the mutation so a concurrent human-created duplicate
          # cannot turn the tag-addressed asset upload below into a guess. The
          # releases collection is eventually consistent after POST/PATCH even
          # though the mutation response already carries the immutable id, so
          # retry only while that exact id is absent. Once visible, the contract
          # helper still fails closed on duplicates or any identity mismatch.
          git fetch --force --tags origin
          release_pages="$RUNNER_TEMP/sdsync-created-pages.json"
          release_index="$RUNNER_TEMP/sdsync-created-index.json"
          tag_sha_json=null
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tag_sha_json=$(git rev-list -n 1 "$TAG" | jq -R .)
          fi
          state_input="$RUNNER_TEMP/sdsync-created-state-input.json"
          state="$RUNNER_TEMP/sdsync-created-state.json"
          max_visibility_attempts=6
          visibility_delay_seconds=1
          for visibility_attempt in $(seq 1 "$max_visibility_attempts"); do
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > "$release_pages"
            jq -s 'add // []' "$release_pages" > "$release_index"

            if ! jq -e --argjson id "$release_id" \
              'any(.[]; .id == $id)' "$release_index" >/dev/null; then
              if jq -e --arg tag "$TAG" \
                'any(.[]; .tag_name == $tag)' "$release_index" >/dev/null; then
                conflicting_releases=$(jq -c --arg tag "$TAG" '
                  [.[] | select(.tag_name == $tag) |
                    {id, draft, target_commitish, html_url}]
                  ' "$release_index")
                echo "release tag $TAG is already visible on unexpected immutable state $conflicting_releases while expected id $release_id is absent" >&2
                exit 1
              fi
              if [[ "$visibility_attempt" -eq "$max_visibility_attempts" ]]; then
                echo "draft release $TAG (immutable id $release_id) was still absent from the releases collection after $max_visibility_attempts attempts" >&2
                exit 1
              fi
              echo "draft release $TAG (immutable id $release_id) is not visible in the releases collection yet (attempt $visibility_attempt/$max_visibility_attempts); retrying in ${visibility_delay_seconds}s" >&2
              sleep "$visibility_delay_seconds"
              visibility_delay_seconds=$((visibility_delay_seconds * 2))
              continue
            fi

            jq -n \
              --arg tag "$TAG" \
              --arg sha "$SHA" \
              --arg repository "$GITHUB_REPOSITORY" \
              --argjson expected_release_id "$release_id" \
              --argjson tag_sha "$tag_sha_json" \
              --slurpfile releases "$release_index" '
                {
                  tag: $tag,
                  sha: $sha,
                  repository: $repository,
                  expected_release_id: $expected_release_id,
                  tag_sha: $tag_sha,
                  releases: $releases[0]
                }
              ' > "$state_input"
            python3 .github/scripts/release-contract.py resolve-publish-state \
              --input "$state_input" \
              --output "$state"
            resolved_id=$(jq -er '.release_id' "$state")
            jq -e '.published | type == "boolean"' "$state" >/dev/null
            resolved_published=$(jq -r '.published' "$state")
            [[ "$resolved_id" == "$release_id" ]] || {
              echo "release id changed after draft update: $release_id -> $resolved_id" >&2
              exit 1
            }
            [[ "$resolved_published" == false ]] || {
              echo "release $TAG (immutable id $release_id) was published concurrently while staging" >&2
              exit 1
            }
            echo "draft release $TAG (immutable id $release_id) became visible after attempt $visibility_attempt/$max_visibility_attempts"
            break
          done
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "staged draft release $TAG (id $release_id)"
      - name: Upload and verify draft assets
        # MUTATION GUARD: uploads release assets.
        if: needs.version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          asset_list="$RUNNER_TEMP/sdsync-assets.bin"
          mapfile -d '' -t assets < "$asset_list"

          # `gh release upload` addresses a release by tag. That is safe here
          # only because the step above proved exactly one release carries this
          # tag name; with duplicates gh picks a match non-deterministically.
          gh release upload "$TAG" "${assets[@]}" --clobber

          remote_pages="$RUNNER_TEMP/sdsync-remote-asset-pages.json"
          remote_index="$RUNNER_TEMP/sdsync-remote-assets.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            > "$remote_pages"
          jq -s 'add // []' "$remote_pages" > "$remote_index"
          python3 .github/scripts/release-contract.py verify-remote-assets \
            --input "$remote_index" \
            --tag "$TAG" \
            --directory dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.dry_run != 'true'
        with:
          name: staged-release-contract
          path: ${{ runner.temp }}/sdsync-local-asset-index.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Collect the dry-run bundle
        if: needs.version.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dry-run
          cp -r dist dry-run/assets
          cp -- "$RUNNER_TEMP/sdsync-release-notes.md" dry-run/RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.dry_run == 'true'
        with:
          # The dry run publishes nothing, so the exact asset set it would have
          # published -- plus the rendered changelog -- is preserved here for
          # inspection instead.
          name: dry-run-release-bundle
          path: dry-run
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish immutable GitHub Release
    # Audit H1: publication now happens BEFORE the mutable GHCR tags are
    # created, so :latest can never advertise a version that has no GitHub
    # release, no git tag and no checksums.
    needs: [version, stage-release]
    # MUTATION GUARD: the whole job creates the git tag and publishes the
    # release, so a dry run skips it entirely.
    if: >-
      needs.version.outputs.already_published != 'true' &&
      needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staged-release-contract
          path: release-contract
      - name: Publish verified draft exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "staging did not provide a valid immutable release id: $RELEASE_ID" >&2
            exit 1
          }

          # Resolve by the immutable id handed off by stage-release. The
          # published state is accepted only for recovery when this exact job
          # is re-run after PATCH succeeded but a later verification failed.
          git fetch --force --tags origin
          release_pages="$RUNNER_TEMP/sdsync-final-pages.json"
          release_index="$RUNNER_TEMP/sdsync-final-index.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > "$release_pages"
          jq -s 'add // []' "$release_pages" > "$release_index"
          tag_sha_json=null
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tag_sha_json=$(git rev-list -n 1 "$TAG" | jq -R .)
          fi
          state_input="$RUNNER_TEMP/sdsync-final-state-input.json"
          state="$RUNNER_TEMP/sdsync-final-state.json"
          jq -n \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson expected_release_id "$RELEASE_ID" \
            --argjson tag_sha "$tag_sha_json" \
            --slurpfile releases "$release_index" '
              {
                tag: $tag,
                sha: $sha,
                repository: $repository,
                expected_release_id: $expected_release_id,
                tag_sha: $tag_sha,
                releases: $releases[0]
              }
            ' > "$state_input"
          python3 .github/scripts/release-contract.py resolve-publish-state \
            --input "$state_input" \
            --output "$state"
          release_id=$(jq -er '.release_id | select(type == "number" and . > 0)' "$state")
          tag_matches=$(jq -r '.tag_matches' "$state")
          [[ "$tag_matches" == true || "$tag_matches" == false ]] || {
            echo "release helper returned a malformed tag_matches value" >&2
            exit 1
          }
          published=$(jq -r '.published' "$state")
          [[ "$published" == true || "$published" == false ]] || {
            echo "release helper returned a malformed published value" >&2
            exit 1
          }
          if [[ "$RELEASE_ID" != "$release_id" ]]; then
            echo "release id changed between staging ($RELEASE_ID) and publication ($release_id)" >&2
            exit 1
          fi

          release_json="$RUNNER_TEMP/sdsync-final-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          jq -e \
            --argjson id "$release_id" \
            --argjson tag_matches "$tag_matches" \
            --argjson published "$published" \
            --arg tag "$TAG" \
            --arg sha "$SHA" '
              .id == $id
              and .draft == (if $published then false else true end)
              and .tag_name == $tag
              and ($tag_matches or .target_commitish == $sha)
            ' "$release_json" >/dev/null || {
              echo "release $TAG (id $release_id) changed after state resolution" >&2
              exit 1
            }

          remote_pages="$RUNNER_TEMP/sdsync-final-asset-pages.json"
          remote_index="$RUNNER_TEMP/sdsync-final-assets.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            > "$remote_pages"
          jq -s 'add // []' "$remote_pages" > "$remote_index"
          python3 .github/scripts/release-contract.py verify-remote-assets \
            --input "$remote_index" \
            --tag "$TAG" \
            --index release-contract/sdsync-local-asset-index.json

          if [[ "$published" == false ]]; then
            # MUTATION: publishing the draft is what creates the git tag.
            # Addressed by id, not by tag name -- a draft cannot be resolved by
            # tag, and gh's own fallback is non-deterministic across duplicates.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -f make_latest=true > /dev/null
          else
            echo "release $TAG (id $release_id) is already published; verifying recovery state"
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$release_json"
          jq -e \
            --argjson id "$release_id" \
            --arg tag "$TAG" '
              .id == $id
              and .tag_name == $tag
              and .draft == false
              and .prerelease == false
            ' "$release_json" >/dev/null || {
              echo "release $TAG (id $release_id) is not in the exact published state" >&2
              exit 1
            }
          git fetch --force --tags origin
          published_sha=$(git rev-list -n 1 "$TAG")
          [[ "$published_sha" == "$SHA" ]] || {
            echo "published tag $TAG resolves to $published_sha, expected $SHA" >&2
            exit 1
          }
          echo "published release $TAG (id $release_id) at $SHA"

  publish-image:
    name: Publish multi-architecture image
    # Audit H1: runs only after the GitHub Release is live, so :latest and :TAG
    # can never point at an unreleased build.
    #
    # Failure here leaves a published release whose container tags are missing.
    # Recovery is "Re-run failed jobs" on this same workflow run: publish-release
    # accepts only its exact staged id/tag/SHA and the per-arch digests remain
    # available for 7 days. A fresh workflow run remains a no-op for an already
    # published SHA, so re-run the failed jobs rather than re-triggering it.
    needs: [version, stage-release, sbom, image, publish-release]
    # MUTATION GUARD: creates the public GHCR tags and pushes two attestations.
    if: >-
      needs.version.outputs.already_published != 'true' &&
      needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-sbom
          path: sbom
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - id: digest
        name: Publish and verify immutable manifest tags
        env:
          IMAGE: ${{ needs.version.outputs.image }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          amd64=$(cat digests/image-digest-amd64.txt)
          arm64=$(cat digests/image-digest-arm64.txt)
          for digest in "$amd64" "$arm64"; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "per-architecture digest is malformed: '$digest'" >&2
              exit 1
            }
          done
          # Guards against the two matrix legs handing over the same digest,
          # which would silently produce a manifest with two identical platforms.
          [[ "$amd64" != "$arm64" ]] || {
            echo "amd64 and arm64 report the same digest $amd64; refusing to build the manifest" >&2
            exit 1
          }

          expected_index="$RUNNER_TEMP/sdsync-expected-image-index.json"
          docker buildx imagetools create --dry-run \
            "$IMAGE@$amd64" \
            "$IMAGE@$arm64" > "$expected_index"
          python3 .github/scripts/release-contract.py verify-image-index \
            --input "$expected_index"

          # A calendar-version tag is immutable. If it already exists during a
          # failed-job rerun, accept it only when its parsed manifest is exactly
          # the index that these two architecture jobs produced. Buildx and the
          # registry can serialize the same JSON object differently, so rendered
          # bytes cannot predict the registry's authoritative digest.
          version_index="$RUNNER_TEMP/sdsync-version-image-index.json"
          existing_error="$RUNNER_TEMP/sdsync-existing-version-error.log"
          version_exists=false
          if docker buildx imagetools inspect --raw "$IMAGE:$TAG" \
            > "$version_index" 2> "$existing_error"; then
            version_exists=true
          elif ! grep -Fq ': not found' "$existing_error"; then
            echo "could not safely determine whether $IMAGE:$TAG exists:" >&2
            cat "$existing_error" >&2
            exit 1
          fi

          metadata="$RUNNER_TEMP/sdsync-image-metadata.json"
          version_digest=''
          if [[ "$version_exists" == true ]]; then
            if ! python3 .github/scripts/release-contract.py verify-image-index-match \
              --expected "$expected_index" \
              --actual "$version_index"; then
              echo "$IMAGE:$TAG differs from the exact intended index; refusing to overwrite the immutable version tag" >&2
              exit 1
            fi
            version_digest=$(docker buildx imagetools inspect \
              "$IMAGE:$TAG" --format '{{.Manifest.Digest}}')
            [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "$IMAGE:$TAG returned a malformed registry digest: '$version_digest'" >&2
              exit 1
            }
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$IMAGE:latest" \
              "$IMAGE@$version_digest"
          else
            docker buildx imagetools create \
              --metadata-file "$metadata" \
              --tag "$IMAGE:$TAG" \
              --tag "$IMAGE:latest" \
              "$IMAGE@$amd64" \
              "$IMAGE@$arm64"
            version_digest=$(jq -r '."containerimage.descriptor".digest // empty' "$metadata")
            [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "imagetools returned a malformed created digest: '$version_digest'" >&2
              exit 1
            }
          fi

          for remote_tag in "$TAG" latest; do
            remote_index="$RUNNER_TEMP/sdsync-remote-$remote_tag-image-index.json"
            docker buildx imagetools inspect --raw "$IMAGE:$remote_tag" > "$remote_index"
            python3 .github/scripts/release-contract.py verify-image-index-match \
              --expected "$expected_index" \
              --actual "$remote_index"
            remote_digest=$(docker buildx imagetools inspect \
              "$IMAGE:$remote_tag" --format '{{.Manifest.Digest}}')
            [[ "$remote_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "$IMAGE:$remote_tag returned a malformed registry digest: '$remote_digest'" >&2
              exit 1
            }
            [[ "$remote_digest" == "$version_digest" ]] || {
              echo "$IMAGE:$remote_tag resolves to $remote_digest, expected immutable version digest $version_digest" >&2
              exit 1
            }
          done
          echo "value=$version_digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:$TAG"
      - name: Attest image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.version.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
      - name: Attest image dependency SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ needs.version.outputs.image }}
          subject-digest: ${{ steps.digest.outputs.value }}
          sbom-path: sbom/synology-drive-sync-${{ needs.version.outputs.tag }}.cdx.json
          push-to-registry: true
