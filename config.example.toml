# synology-drive-sync configuration is deliberately non-secret.
#
# Copy this file to the platform path printed by:
#   synology-drive-sync config path
#
# Relative paths are resolved from the directory containing this file. Unknown
# keys are rejected. Passwords, TOTP seeds, current OTP codes, and bearer-token
# values are not valid TOML fields; only protected file paths or the name of a
# token-bearing environment variable may be configured.

default-profile = "production"

# Every named profile is an independent job; profiles do not inherit from one
# another. Batch plan/sync therefore requires source, remote, url, username, and
# authentication settings to resolve separately for every selected profile.
# Examples (the aggregate cap is a CLI/environment guard, not a TOML field):
#   synology-drive-sync plan --config ./config.toml --profiles production,archive --max-total-delete 20 --output json
#   synology-drive-sync sync --config ./config.toml --all-profiles --max-total-delete 20 --output ndjson
# When omitted, --max-total-delete / SDSYNC_MAX_TOTAL_DELETE defaults to 100.
# An initial or fresh-replan aggregate-cap breach is an operational exit 1;
# neither authorizes mutation for the blocked profile.
# Batch plan/sync and target diagnostics reject --password-stdin; use vault entries or a
# protected password-file (and totp-secret-file when required) for each profile.

[profiles.production]
# SOURCE and REMOTE may be omitted here and supplied to each sync/plan command.
# In the DSM package, source is an absolute local NAS path such as
# /volume1/Source and the system-internal package user needs read-only access.
source = "./data/export"
# REMOTE is a File Station logical path, never /volume1/.... It can be any
# writable chosen subdirectory. For example, use /home/Drive/NAS-A Backup for
# the remote account's Drive home or /team-folder/Chosen Folder for a Team
# Folder. DSM must create the user-home/shared-folder root and grant permission;
# sync creates a missing destination below that existing share and all children.
# The DSM manager also rejects trailing/empty/dot segments and DSM-managed
# components such as @eaDir, @tmp, #recycle, #snapshot, @sharebin, and DSM
# package roots such as @apphome/@appdata/@appstore/@apptemp/@appconf.
remote = "/team-folder/project"

# Public File Station reverse-proxy URL and dedicated DSM account.
url = "https://files.example.com"
username = "mirror-bot"

# Prefer the current user's OS vault. For headless services, uncomment protected
# secret-file paths and set no-vault=true. Never paste secret values into TOML.
# password-file = "./secrets/dsm-password"
# totp-secret-file = "./secrets/dsm-totp"
no-vault = false

# Sync selection and comparison.
compare = "content"  # content | metadata | size-only
jobs = 2              # 1..16
excludes = ["target/", "*.tmp", ".cache/"]

# Additive/update-only is the safe default. Enabling delete makes the remote an
# exact mirror and should be paired with an intentionally small deletion cap.
delete = false
allow-empty-source = false
max-delete = 100

# Network behavior.
retries = 2            # 0..5
timeout = 7200         # upload/background-operation seconds; cover the largest upload
connect-timeout = 15   # TCP/TLS connection seconds
# max-rate = 1048576   # upload bytes per second, shared by all jobs; unset is unlimited.
# A limit stretches every transfer, so keep timeout above the largest single
# upload at the limited rate: 1048576 is 1 MiB/s, so a 4 GiB file needs ~4096s.
# Discovery, login, inventory, hash, and other control requests are capped at 10s.
# An outer scheduler limit covers the whole workload, not one request. Size it
# above measured worst-case scanning, hashing, every operation/retry, and shutdown.
# A retry restarts the file unless content mode proves the first attempt completed.
# ca-certificate = "./pki/private-root.pem"
allow-http = false
danger-accept-invalid-certs = false

# Diagnostics and result output are independent. -v/-vv and CLI options override
# these values. Secret-free logs go to stderr unless quiet=true.
verbose = 0
quiet = false
log-level = "info"       # trace | debug | info | warn | error | off
log-format = "human"     # human | json
# A configured file sink rotates at 10 MiB with three backups. Provision its
# directory for the service identity before enabling it.
# log-file = "./logs/synology-drive-sync.log"
progress = "auto"        # auto | always | never
output = "human"         # human | json | ndjson

# Optional HTTPS structured-log collector. Select at most one token source.
# When neither is set, SDSYNC_REMOTE_LOG_TOKEN is used.
# remote-log-url = "https://logs.example.com/v1/events"
# remote-log-token-file = "./secrets/log-token"
# remote-log-token-env = "SDSYNC_REMOTE_LOG_TOKEN"
remote-log-mode = "best-effort" # best-effort | required

# A second complete profile can participate in a batch. Use one canonical public
# URL for each NAS: overlap checks cannot recognize that different DNS names or
# reverse-proxy prefixes are aliases for the same appliance.
#
# [profiles.archive]
# source = "./data/archive"
# remote = "/home/Drive/NAS-A Archive"
# url = "https://files.example.com"
# username = "archive-bot"
# password-file = "./secrets/archive-dsm-password"
# totp-secret-file = "./secrets/archive-dsm-totp" # only when the account uses app TOTP
# no-vault = true
# compare = "content"
# jobs = 2
# delete = false
# allow-empty-source = false
# max-delete = 25
# output = "json"
#
# A minimal profile may instead leave SOURCE and REMOTE to a single-profile
# invocation. Such an incomplete profile cannot be selected for batch plan/sync:
#
# [profiles.personal]
# url = "https://files.example.com/nas/"
# username = "alice"
# jobs = 4
