[book]
title = "synology-drive-sync: Push files to your Synology NAS"
authors = ["synology-drive-sync contributors"]
description = "A fast, one-way file deposit to a Synology NAS over DSM's File Station API with a normal DSM account, for servers, containers, CI and other machines that can't run Synology Drive Client. Use it from the CLI, Rust SDK, C ABI or the included DSM package."
src = "docs"
language = "en"
text-direction = "ltr"

[build]
build-dir = "target/site"
create-missing = false

[rust]
edition = "2024"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
definition-lists = true
admonitions = true
no-section-label = true
site-url = "/synology-drive-sync/"
input-404 = "404.md"
sidebar-header-nav = true
git-repository-url = "https://github.com/supermarsx/synology-drive-sync"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/supermarsx/synology-drive-sync/edit/main/{path}"
additional-css = ["docs/theme/sdsync.css"]
additional-js = [
    "docs/theme/release-selector-data.js",
    "docs/theme/release-selector.js",
]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 50
teaser-word-count = 32
use-boolean-and = true
boost-title = 3
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2
copy-js = true

[output.html.playground]
editable = false
copyable = true
runnable = false
