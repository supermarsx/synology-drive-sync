[package]
name = "synology-drive-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lean one-way folder sync to Synology Drive-backed folders through File Station WebAPI"
license = "MIT"
repository = "https://github.com/supermarsx/synology-drive-sync"
keywords = ["synology", "file-station", "sync", "backup", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.5", features = ["derive", "env"] }
ignore = "0.4.31"
keyring-core = "1.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "multipart", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "2.0"
totp-rs = { version = "5.7.2", default-features = false, features = ["zeroize"] }
zeroize = "1.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.1", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.0", default-features = false, features = ["crypto-rust"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
