[package]
name = "synology-drive-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lean one-way folder sync to Synology Drive-backed folders through File Station WebAPI"
license = "MIT"
repository = "https://github.com/supermarsx/synology-drive-sync"
keywords = ["synology", "file-station", "sync", "backup", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.5", features = ["derive", "env"] }
ignore = "0.4.31"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "multipart", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
