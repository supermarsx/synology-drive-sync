[package]
name = "synology-drive-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Lean one-way folder sync to Synology Drive-backed folders through File Station WebAPI"
license = "MIT"
readme = "readme.md"
repository = "https://github.com/supermarsx/synology-drive-sync"
keywords = ["synology", "file-station", "sync", "backup", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/Cargo.lock",
    "/license.md",
    "/readme.md",
    "/third_party_licenses.html",
    "/build.rs",
    "/config.example.toml",
    "/docs/observability.schema.json",
    "/examples/sdk/**",
    "/src/**",
    "/tests/**",
]

[[example]]
name = "sdk-basic"
path = "examples/sdk/basic.rs"

[workspace]
members = ["crates/synology-drive-sync-ffi"]
resolver = "3"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
crc32fast = "1.5.3"
ignore = "0.4.33"
keyring-core = "1.0.1"
md-5 = { version = "0.11.0", default-features = false }
hmac = "0.13.0"
# Already in the tree through `url` -> `idna`; named directly so path comparison can fold
# NFC and NFD spellings of one name together (see `path::nfc`).
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# `rustls-no-provider` rather than `rustls`: reqwest's `rustls` feature hard-wires
# the aws-lc-rs provider, whose RNG falls back to /dev/urandom with an
# RNDGETENTCNT wait when the kernel has no getrandom(2). On a headless NAS that
# blocks for tens of minutes inside TLS client construction -- which is outside
# every request deadline this crate has -- and stalls the whole serial job queue.
# ring reaches the same randomness through the getrandom crate, which waits at
# most once for the pool to initialise and never re-blocks. Selecting the
# provider here means this crate must install it; see `install_crypto_provider`.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "multipart", "rustls-no-provider"] }
# Already in the tree through `reqwest`; named directly so an upload body can be a stream the
# client watches for stalls (`api::UploadBody`), which a blocking reader cannot do.
bytes = "1.12.1"
http-body = "1.1.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "zeroize"] }
zeroize = "1.9.1"

# The verified-pair index (`pair_index_redb`). Unix only: the index needs a file identity and a
# status-change time, which Windows does not expose through a path stat, so it is never used
# there. 4.2 and later report damaged files as errors instead of panicking.
[target.'cfg(unix)'.dependencies]
redb = "4.4.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
# Already in the tree through `ctrlc`; named directly for the native realtime watcher
# (`watch::TreeWatch`): inotify, poll(2) on its descriptor, and the parent-death signal that stops
# a watcher whose controller died. Safe wrappers only, so the library stays `forbid(unsafe_code)`.
nix = { version = "0.31.3", default-features = false, features = ["inotify", "poll", "process", "signal"] }
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }

[features]
# `SDSYNC_FAULT_BLOCK=read_dir:*/slow` blocks the watcher's directory walk forever on a matching
# path, the way a directory on a dying disk does, so a test can prove the walk's deadline. Never
# enabled in a release build.
fault-inject = []

# redb's debug assertions walk every page of a file at open, before anything has verified it, and
# panic on a corrupted page that release builds report as an error. Tests must exercise the code
# that ships, so redb is built as it ships in every profile.
[profile.dev.package.redb]
debug-assertions = false
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# A C ABI must contain panics instead of aborting an embedding process. The
# FFI package is built with this profile; normal CLI releases retain the
# smaller fail-fast `release` profile above.
[profile.ffi-release]
inherits = "release"
panic = "unwind"
