[package]
name = "synology-drive-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lean one-way folder sync to Synology Drive-backed folders through File Station WebAPI"
license = "MIT"
readme = "readme.md"
repository = "https://github.com/supermarsx/synology-drive-sync"
keywords = ["synology", "file-station", "sync", "backup", "cli"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/Cargo.lock",
    "/license.md",
    "/readme.md",
    "/third_party_licenses.html",
    "/build.rs",
    "/config.example.toml",
    "/docs/observability.schema.json",
    "/examples/sdk/**",
    "/src/**",
    "/tests/**",
]

[[example]]
name = "sdk-basic"
path = "examples/sdk/basic.rs"

[workspace]
members = ["crates/synology-drive-sync-ffi"]
resolver = "3"

[dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
crc32fast = "1.5.1"
ignore = "0.4.33"
keyring-core = "1.0.0"
md-5 = { version = "0.11.0", default-features = false }
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "multipart", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
toml = "1.1.4"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "zeroize"] }
zeroize = "1.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# A C ABI must contain panics instead of aborting an embedding process. The
# FFI package is built with this profile; normal CLI releases retain the
# smaller fail-fast `release` profile above.
[profile.ffi-release]
inherits = "release"
panic = "unwind"
